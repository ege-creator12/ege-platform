<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet"><title id="title">Синовиальный сустав</title><desc id="desc">Разрез подвижного сустава: поверхности костей, хрящ, капсула, полость с жидкостью и связка.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#244f49"/></marker><style>.t{font:600 16px Arial,sans-serif;fill:#173b35}.s{font:14px Arial,sans-serif;fill:#173b35}.lead{fill:none;stroke:#244f49;stroke-width:2}.flow{fill:none;stroke:#176b5b;stroke-width:4;marker-end:url(#arrow)}.organ{stroke:#244f49;stroke-width:3}.red{fill:#f7a4a4}.blue{fill:#9bc8ef}.cream{fill:#fff0c9}.green{fill:#b9e4d7}</style></defs><rect width="800" height="560" rx="22" fill="#f8fcfb"/><text x="400" y="36" text-anchor="middle" class="t" font-size="23">Синовиальный сустав</text><path d="M90 120H330Q390 120 390 220Q390 300 310 300H90Z" fill="#f1d3a0" class="organ"/><path d="M710 440H470Q410 440 410 340Q410 260 490 260H710Z" fill="#f1d3a0" class="organ"/><path d="M328 135Q375 150 375 220Q375 275 320 285" stroke="#75c9cf" stroke-width="25" fill="none"/><path d="M472 425Q425 410 425 340Q425 285 480 275" stroke="#75c9cf" stroke-width="25" fill="none"/><path d="M300 85Q435 55 520 150M280 475Q420 520 545 405" stroke="#b56383" stroke-width="18" fill="none"/><path d="M265 120Q400 40 535 120V440Q400 520 265 440Z" fill="none" stroke="#724f70" stroke-width="8"/><text x="45" y="75" class="t">суставная капсула</text><path d="M205 72L290 105" class="lead"/><text x="535" y="85" class="t">связка</text><path d="M600 90L500 135" class="lead"/><text x="300" y="240" class="t">хрящ</text><text x="438" y="330" class="t">полость + жидкость</text></svg>
