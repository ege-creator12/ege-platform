<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 815" role="img" aria-labelledby="t d"><title id="t">Сравнение беспозвоночных</title><desc id="d">Смысловая структурная схема: Кишечнополостные: Два основных слоя клеток, кишечная полость, стрекательные клетки.; Плоские и круглые черви: Плоские: полости тела нет. Круглые: первичная полость и сквозной кишечник.; Кольчатые черви: Сегментация, вторичная полость тела; кровеносная система обычно замкнутая.; Моллюски: Мантия и мантийная полость; тело обычно включает голову, туловище и ногу, с изменениями у разных классов.; Членистоногие: Членистые конечности, наружный скелет, линька; кровеносная система незамкнутая.</desc><rect width="680" height="815" rx="20" fill="#fafbf8"/><g font-family="Arial,sans-serif" fill="#234c3c"><text x="28" y="40" font-size="26" font-weight="700">Сравнение беспозвоночных</text><text x="28" y="70" font-size="17" fill="#62776d">Структуры и связи · учебная схема</text><rect x="22" y="96" width="636" height="120" rx="16" fill="#e3efe8"/><text x="42" y="128" font-size="24" font-weight="700">Кишечнополостные</text><text x="42" y="161" font-size="22">Два основных слоя клеток, кишечная полость,</text><text x="42" y="188" font-size="22">стрекательные клетки.</text><rect x="22" y="230" width="636" height="120" rx="16" fill="#edf1e3"/><text x="42" y="262" font-size="24" font-weight="700">Плоские и круглые черви</text><text x="42" y="295" font-size="22">Плоские: полости тела нет. Круглые: первичная</text><text x="42" y="322" font-size="22">полость и сквозной кишечник.</text><rect x="22" y="364" width="636" height="120" rx="16" fill="#e3efe8"/><text x="42" y="396" font-size="24" font-weight="700">Кольчатые черви</text><text x="42" y="429" font-size="22">Сегментация, вторичная полость тела; кровеносная</text><text x="42" y="456" font-size="22">система обычно замкнутая.</text><rect x="22" y="498" width="636" height="147" rx="16" fill="#edf1e3"/><text x="42" y="530" font-size="24" font-weight="700">Моллюски</text><text x="42" y="563" font-size="22">Мантия и мантийная полость; тело обычно включает</text><text x="42" y="590" font-size="22">голову, туловище и ногу, с изменениями у разных</text><text x="42" y="617" font-size="22">классов.</text><rect x="22" y="659" width="636" height="120" rx="16" fill="#e3efe8"/><text x="42" y="691" font-size="24" font-weight="700">Членистоногие</text><text x="42" y="724" font-size="22">Членистые конечности, наружный скелет, линька;</text><text x="42" y="751" font-size="22">кровеносная система незамкнутая.</text></g></svg>
