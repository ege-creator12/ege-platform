<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet"><title id="title">Отделы головного мозга</title><desc id="desc">Боковая схема мозга с большими полушариями, промежуточным, средним, продолговатым мозгом, мостом и мозжечком.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#244f49"/></marker><style>.t{font:600 16px Arial,sans-serif;fill:#173b35}.s{font:14px Arial,sans-serif;fill:#173b35}.lead{fill:none;stroke:#244f49;stroke-width:2}.flow{fill:none;stroke:#176b5b;stroke-width:4;marker-end:url(#arrow)}.organ{stroke:#244f49;stroke-width:3}.red{fill:#f7a4a4}.blue{fill:#9bc8ef}.cream{fill:#fff0c9}.green{fill:#b9e4d7}</style></defs><rect width="800" height="560" rx="22" fill="#f8fcfb"/><text x="400" y="36" text-anchor="middle" class="t" font-size="23">Отделы головного мозга</text><path d="M180 240Q120 105 300 65Q510 20 650 150Q740 250 620 340Q520 395 350 330Q245 350 180 240Z" fill="#efb4b4" class="organ"/><path d="M270 120Q230 205 315 280M390 80Q350 180 420 310M520 95Q475 185 555 300" fill="none" stroke="#c67979" stroke-width="5"/><ellipse cx="535" cy="360" rx="105" ry="80" fill="#d998a4" class="organ"/><path d="M390 300Q430 350 415 455L380 520" fill="none" stroke="#d1a168" stroke-width="45"/><circle cx="400" cy="275" r="42" fill="#e8c36b" class="organ"/><text x="300" y="55" class="t">большие полушария и кора</text><text x="40" y="230" class="t">промежуточный мозг</text><path d="M230 225L360 260" class="lead"/><text x="40" y="350" class="t">средний мозг и мост</text><path d="M230 345L405 340" class="lead"/><text x="505" y="465" class="t">мозжечок</text><text x="245" y="530" class="t">продолговатый мозг</text></svg>
