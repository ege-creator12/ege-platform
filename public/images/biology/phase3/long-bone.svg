<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet"><title id="title">Длинная трубчатая кость</title><desc id="desc">Продольный разрез кости: эпифизы, диафиз, надкостница, компактное и губчатое вещество, костный мозг и суставной хрящ.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#244f49"/></marker><style>.t{font:600 16px Arial,sans-serif;fill:#173b35}.s{font:14px Arial,sans-serif;fill:#173b35}.lead{fill:none;stroke:#244f49;stroke-width:2}.flow{fill:none;stroke:#176b5b;stroke-width:4;marker-end:url(#arrow)}.organ{stroke:#244f49;stroke-width:3}.red{fill:#f7a4a4}.blue{fill:#9bc8ef}.cream{fill:#fff0c9}.green{fill:#b9e4d7}</style></defs><rect width="800" height="580" rx="22" fill="#f8fcfb"/><text x="400" y="36" text-anchor="middle" class="t" font-size="23">Длинная трубчатая кость</text><path d="M260 90Q180 115 210 190L245 230V390L210 430Q180 505 270 520H530Q620 505 590 430L555 390V230L590 190Q620 115 540 90Z" fill="#f4d9b1" class="organ"/><path d="M290 105Q235 130 255 180L285 215H515L545 180Q565 130 510 105Z" fill="#e8b6a0"/><path d="M285 430Q245 475 300 500H500Q555 475 515 430Z" fill="#e8b6a0"/><rect x="315" y="210" width="170" height="230" rx="35" fill="#fff4ce" stroke="#9b754a" stroke-width="12"/><rect x="350" y="235" width="100" height="180" rx="30" fill="#f5db6f"/><path d="M248 95Q400 65 552 95" stroke="#8ecfc4" stroke-width="18" fill="none"/><text x="35" y="125" class="t">суставной хрящ</text><path d="M190 120H260" class="lead"/><text x="35" y="220" class="t">губчатое вещество</text><path d="M195 215L270 165" class="lead"/><text x="35" y="330" class="t">надкостница</text><path d="M170 325H245" class="lead"/><text x="600" y="235" class="t">компактное</text><path d="M590 240L490 270" class="lead"/><text x="585" y="350" class="t">жёлтый мозг</text><path d="M580 345H450" class="lead"/><text x="350" y="550" class="t">эпифиз — диафиз — эпифиз</text></svg>
