<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Транспорт в растении</title><desc id="desc">Корень, лист, ксилема и флоэма с направлениями потоков</desc><style>.bg{fill:#f7fbf5}.card{fill:#fff;stroke:#2f6f4e;stroke-width:3}.h{font:700 28px system-ui;fill:#173d2b}.t{font:600 18px system-ui;fill:#173d2b}.small{font:15px system-ui;fill:#355746}.arrow{stroke:#d07835;stroke-width:5;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d07835"/></marker></defs><rect class="bg" width="960" height="560" rx="24"/><text class="h" x="48" y="54">Транспорт в растении</text><rect class="card" x="40" y="205" width="220" height="130" rx="18"/><text class="t" x="58" y="239">Корень</text><text class="small" x="58" y="270">вода: осмос</text><text class="small" x="58" y="294">ионы: транспорт белками</text><rect class="card" x="370" y="80" width="220" height="150" rx="18"/><text class="t" x="388" y="114">Лист — источник</text><text class="small" x="388" y="145">CO₂ + свет + H₂O</text><text class="small" x="388" y="169">органические вещества</text><text class="small" x="388" y="193">транспирация</text><rect class="card" x="700" y="205" width="220" height="130" rx="18"/><text class="t" x="718" y="239">Потребители</text><text class="small" x="718" y="270">плод, меристема, корень</text><text class="small" x="718" y="294">или новый побег</text><rect class="card" x="370" y="340" width="220" height="130" rx="18"/><text class="t" x="388" y="374">Проводящие ткани</text><text class="small" x="388" y="405">ксилема: вода ↟</text><text class="small" x="388" y="429">флоэма: источник → цель</text><path class="arrow" d="M260 255 C320 255 320 150 370 150"/><path class="arrow" d="M590 150 C650 150 650 255 700 255"/><path class="arrow" d="M480 340 L480 235"/></svg>
