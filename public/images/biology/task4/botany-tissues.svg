<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Ткани растений</title><desc id="desc">Схема шести типов тканей, их строения и функций</desc><style>.bg{fill:#f7fbf5}.card{fill:#fff;stroke:#2f6f4e;stroke-width:3}.h{font:700 28px system-ui;fill:#173d2b}.t{font:600 18px system-ui;fill:#173d2b}.small{font:15px system-ui;fill:#355746}.arrow{stroke:#d07835;stroke-width:5;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d07835"/></marker></defs><rect class="bg" width="960" height="560" rx="24"/><text class="h" x="48" y="54">Ткани растений</text><rect class="card" x="35" y="85" width="280" height="120" rx="18"/><text class="t" x="53" y="119">Образовательная</text><text class="small" x="53" y="150">делящиеся живые клетки</text><text class="small" x="53" y="174">рост в длину и толщину</text><rect class="card" x="340" y="85" width="280" height="120" rx="18"/><text class="t" x="358" y="119">Покровная</text><text class="small" x="358" y="150">эпидерма и пробка</text><text class="small" x="358" y="174">защита и обмен со средой</text><rect class="card" x="645" y="85" width="280" height="120" rx="18"/><text class="t" x="663" y="119">Основная</text><text class="small" x="663" y="150">фотосинтез, запас</text><text class="small" x="663" y="174">воздух и вода</text><rect class="card" x="35" y="235" width="280" height="120" rx="18"/><text class="t" x="53" y="269">Механическая</text><text class="small" x="53" y="300">утолщённые оболочки</text><text class="small" x="53" y="324">прочность и опора</text><rect class="card" x="340" y="235" width="280" height="120" rx="18"/><text class="t" x="358" y="269">Ксилема ↟</text><text class="small" x="358" y="300">сосуды, трахеиды</text><text class="small" x="358" y="324">вода + минеральные ионы</text><rect class="card" x="645" y="235" width="280" height="120" rx="18"/><text class="t" x="663" y="269">Флоэма ↕</text><text class="small" x="663" y="300">ситовидные элементы</text><text class="small" x="663" y="324">источник → потребитель</text><rect class="card" x="340" y="385" width="280" height="120" rx="18"/><text class="t" x="358" y="419">Выделительная</text><text class="small" x="358" y="450">нектарники, млечники</text><text class="small" x="358" y="474">секреция и накопление</text></svg>
