<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet"><title id="title">Ухо: слух и равновесие</title><desc id="desc">Разрез наружного, среднего и внутреннего уха с перепонкой, косточками, улиткой, полукружными каналами и нервом.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#244f49"/></marker><style>.t{font:600 16px Arial,sans-serif;fill:#173b35}.s{font:14px Arial,sans-serif;fill:#173b35}.lead{fill:none;stroke:#244f49;stroke-width:2}.flow{fill:none;stroke:#176b5b;stroke-width:4;marker-end:url(#arrow)}.organ{stroke:#244f49;stroke-width:3}.red{fill:#f7a4a4}.blue{fill:#9bc8ef}.cream{fill:#fff0c9}.green{fill:#b9e4d7}</style></defs><rect width="800" height="560" rx="22" fill="#f8fcfb"/><text x="400" y="36" text-anchor="middle" class="t" font-size="23">Ухо: слух и равновесие</text><path d="M75 180Q20 260 90 355Q160 420 205 340Q235 285 175 250Q115 220 95 285" fill="none" stroke="#e8b391" stroke-width="28"/><path d="M175 285H330" stroke="#dca584" stroke-width="35"/><path d="M330 230L350 340" stroke="#7d6060" stroke-width="10"/><g fill="#efd06e" stroke="#765"><circle cx="380" cy="270" r="18"/><circle cx="420" cy="250" r="16"/><circle cx="455" cy="280" r="14"/></g><path d="M475 280Q525 200 570 260Q620 330 550 380Q490 415 485 350Q485 300 535 300Q570 305 550 340" fill="none" stroke="#bf7ca1" stroke-width="22"/><path d="M500 240Q465 130 535 105Q610 100 590 175Q565 225 525 175Q490 135 555 115" fill="none" stroke="#7bb8b2" stroke-width="14"/><path d="M580 330L735 360" stroke="#e4c451" stroke-width="22"/><text x="45" y="440" class="t">ушная раковина</text><text x="180" y="225" class="t">слуховой проход</text><text x="270" y="195" class="t">барабанная перепонка</text><text x="355" y="215" class="t">слуховые косточки</text><text x="500" y="445" class="t">улитка</text><text x="515" y="75" class="t">по