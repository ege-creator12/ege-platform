<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 788" role="img" aria-labelledby="t d"><title id="t">Гриб: организация и питание</title><desc id="d">Смысловая структурная схема: Гифы → мицелий: Нити образуют грибницу, которая контактирует с субстратом.; Наружное переваривание: Выделенные ферменты расщепляют крупные органические молекулы вне клеток.; Всасывание: Растворённые продукты поступают через поверхность гиф; грибы — гетеротрофы.; Плодовое тело: У шляпочных грибов образовано гифами; связано с формированием и рассеиванием спор.; Грибная клетка: Есть ядро, митохондрии и стенка с хитином; пластид нет, запасается гликоген.</desc><rect width="680" height="788" rx="20" fill="#fafbf8"/><g font-family="Arial,sans-serif" fill="#234c3c"><text x="28" y="40" font-size="26" font-weight="700">Гриб: организация и питание</text><text x="28" y="70" font-size="17" fill="#62776d">Структуры и связи · учебная схема</text><rect x="22" y="96" width="636" height="120" rx="16" fill="#e3efe8"/><text x="42" y="128" font-size="24" font-weight="700">Гифы → мицелий</text><text x="42" y="161" font-size="22">Нити образуют грибницу, которая контактирует с</text><text x="42" y="188" font-size="22">субстратом.</text><rect x="22" y="230" width="636" height="120" rx="16" fill="#edf1e3"/><text x="42" y="262" font-size="24" font-weight="700">Наружное переваривание</text><text x="42" y="295" font-size="22">Выделенные ферменты расщепляют крупные</text><text x="42" y="322" font-size="22">органические молекулы вне клеток.</text><rect x="22" y="364" width="636" height="120" rx="16" fill="#e3efe8"/><text x="42" y="396" font-size="24" font-weight="700">Всасывание</text><text x="42" y="429" font-size="22">Растворённые продукты поступают через поверхность</text><text x="42" y="456" font-size="22">гиф; грибы — гетеротрофы.</text><rect x="22" y="498" width="636" height="120" rx="16" fill="#edf1e3"/><text x="42" y="530" font-size="24" font-weight="700">Плодовое тело</text><text x="42" y="563" font-size="22">У шляпочных грибов образовано гифами; связано с</text><text x="42" y="590" font-size="22">формированием и рассеиванием спор.</text><rect x="22" y="632" width="636" height="120" rx="16" fill="#e3efe8"/><text x="42" y="664" font-size="24" font-weight="700">Грибная клетка</text><text x="42" y="697" font-size="22">Есть ядро, митохондрии и стенка с хитином;</text><text x="42" y="724" font-size="22">пластид нет, запасается гликоген.</text></g></svg>
