<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" role="img" aria-labelledby="title desc"><title id="title">Как не перепутать хозяев</title><desc id="desc">Учебная схема ОСНОВА для подготовки к ЕГЭ: ЦЕПЕНЬ: человек &#8594; яйца &#8594; КРС &#8594; финна &#8594; человек; СОСАЛЬЩИК: яйцо &#8594; прудовик &#8594; циста &#8594; хозяин; АСКАРИДА: яйцо &#8594; кишечник &#8594; кровь &#8594; лёгкие &#8594; кишечник; окончательный хозяин = половозрелая стадия</desc><rect width="920" height="540" rx="28" fill="#FFFDF7"/><text x="460" y="64" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#173B3F">Как не перепутать хозяев</text><path d="M60 88 H860" stroke="#E9A23B" stroke-width="6" stroke-linecap="round"/><g><rect x="60" y="125" width="800" height="77" rx="16" fill="#F1F8EE" stroke="#39736A" stroke-width="2"/><text x="84" y="171.5" font-size="24" font-weight="700" fill="#173B3F">ЦЕПЕНЬ: человек &#8594; яйца &#8594; КРС &#8594; финна &#8594; человек</text></g><g><rect x="60" y="212" width="800" height="77" rx="16" fill="#EAF4FF" stroke="#39736A" stroke-width="2"/><text x="84" y="258.5" font-size="24" font-weight="700" fill="#173B3F">СОСАЛЬЩИК: яйцо &#8594; прудовик &#8594; циста &#8594; хозяин</text></g><g><rect x="60" y="299" width="800" height="77" rx="16" fill="#F1F8EE" stroke="#39736A" stroke-width="2"/><text x="84" y="345.5" font-size="24" font-weight="700" fill="#173B3F">АСКАРИДА: яйцо &#8594; кишечник &#8594; кровь &#8594; лёгкие &#8594; кишечник</text></g><g><rect x="60" y="386" width="800" height="77" rx="16" fill="#EAF4FF" stroke="#39736A" stroke-width="2"/><text x="84" y="432.5" font-size="24" font-weight="500" fill="#173B3F">окончательный хозяин = половозрелая стадия</text></g><text x="860" y="516" text-anchor="end" font-family="Arial,sans-serif" font-size="16" fill="#557276">ОСНОВА · ЕГЭ 2027</text></svg>
