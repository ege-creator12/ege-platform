<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc"><title id="title">Генофонд и элементарные факторы эволюции</title><desc id="desc">Учебная схема: Мутации: новые аллели; Поток: перенос; Дрейф: случайность; Отбор: неслучайный успех. Стрелки показывают причинную или историческую последовательность.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#334155"/></marker><linearGradient id="bg"><stop stop-color="#f0fdf4"/><stop offset="1" stop-color="#eff6ff"/></linearGradient></defs><style>.bg{fill:url(#bg)}.card{stroke:#334155;stroke-width:2}.c0{fill:#dcfce7}.c1{fill:#fef3c7}.c2{fill:#dbeafe}.c3{fill:#f3e8ff}.badge,.node{fill:#fff;stroke:#166534;stroke-width:3}.num{font:bold 20px system-ui;fill:#14532d}text{font:17px system-ui,sans-serif;fill:#172033}.card+text{}.arrow{stroke:#334155;stroke-width:3;marker-end:url(#a)}.branch{fill:none;stroke:#166534;stroke-width:9;stroke-linecap:round}.branch.alt{stroke:#2563eb;stroke-width:6}</style><rect class="bg" width="920" height="520" rx="28"/><text x="460" y="58" text-anchor="middle" style="font:bold 25px system-ui;fill:#123">Генофонд и элементарные факторы эволюции</text><g transform="translate(55 155)"><rect width="180" height="190" rx="24" class="card c0"/><circle cx="90" cy="55" r="28" class="badge"/><text x="90" y="62" text-anchor="middle" class="num">1</text><text x="90" y="112" text-anchor="middle">Мутации: новые аллели</text><path d="M185 95 H207" class="arrow"/></g><g transform="translate(270 155)"><rect width="180" height="190" rx="24" class="card c1"/><circle cx="90" cy="55" r="28" class="badge"/><text x="90" y="62" text-anchor="middle" class="num">2</text><text x="90" y="112" text-anchor="middle">Поток: перенос</text><path d="M185 95 H207" class="arrow"/></g><g transform="translate(485 155)"><rect width="180" height="190" rx="24" class="card c2"/><circle cx="90" cy="55" r="28" class="badge"/><text x="90" y="62" text-anchor="middle" class="num">3</text><text x="90" y="112" text-anchor="middle">Дрейф: случайность</text><path d="M185 95 H207" class="arrow"/></g><g transform="translate(700 155)"><rect width="180" height="190" rx="24" class="card c3"/><circle cx="90" cy="55" r="28" class="badge"/><text x="90" y="62" text-anchor="middle" class="num">4</text><text x="90" y="112" text-anchor="middle">Отбор: неслучайный успех</text></g><text x="460" y="490" text-anchor="middle" style="font:15px system-ui;fill:#475569">Читайте стрелки как «исходное состояние → механизм → следствие»</text></svg>