name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run check
      - run: node --check public/student-runtime-hardening.js
      - run: node --check public/lesson-practice.js
      - run: node --check public/release-navigation-lock.js
      - run: node --check server-release-security-preload.js
      - run: node --check src/lesson-practice.js
      - run: npm test
      - run: npm run audit:biology-theory
      - run: npm run audit:biology-questions
      - run: npm run audit:biology-exam-lines
      - run: npm run audit:biology-mocks
      - run: npm run audit:chemistry-quality
      - run: node scripts/audit-lesson-practice.js
      - run: node scripts/audit-student-surface.js
      - run: node scripts/audit-release-readiness.js
