<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet"><title id="title">Клетки крови</title><desc id="desc">Форменные элементы в плазме: безъядерный двояковогнутый эритроцит, лейкоцит с ядром и мелкие тромбоциты.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#244f49"/></marker><style>.t{font:600 16px Arial,sans-serif;fill:#173b35}.s{font:14px Arial,sans-serif;fill:#173b35}.lead{fill:none;stroke:#244f49;stroke-width:2}.flow{fill:none;stroke:#176b5b;stroke-width:4;marker-end:url(#arrow)}.organ{stroke:#244f49;stroke-width:3}.red{fill:#f7a4a4}.blue{fill:#9bc8ef}.cream{fill:#fff0c9}.green{fill:#b9e4d7}</style></defs><rect width="800" height="560" rx="22" fill="#f8fcfb"/><text x="400" y="36" text-anchor="middle" class="t" font-size="23">Клетки крови</text><ellipse cx="205" cy="265" rx="125" ry="80" fill="#e86666" class="organ"/><ellipse cx="205" cy="265" rx="58" ry="28" fill="#f3a0a0"/><circle cx="500" cy="250" r="100" fill="#e6edf5" class="organ"/><path d="M455 220Q500 170 540 225Q575 275 520 310Q465 330 440 275Z" fill="#7756a3"/><g fill="#e4b751" stroke="#80601d"><circle cx="590" cy="390" r="12"/><circle cx="620" cy="415" r="12"/><circle cx="650" cy="390" r="12"/><circle cx="680" cy="415" r="12"/><circle cx="710" cy="390" r="12"/></g><text x="130" y="400" class="t">эритроцит</text><text x="95" y="430" class="s">двояковогнутый, без ядра</text><text x="460" y="400" class="t">лейкоцит</text><text x="450" y="430" class="s">ядро, защитная функция</text><text x="610" y="470" class="t">тромбоциты</text><text x="95" y="110" class="t">плазма — жидкое межклеточное вещество</text></svg>
