<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Двойное оплодотворение</title><desc id="desc">Два слияния в зародышевом мешке и результаты с обозначением плоидности</desc><style>.bg{fill:#f7fbf5}.card{fill:#fff;stroke:#2f6f4e;stroke-width:3}.h{font:700 28px system-ui;fill:#173d2b}.t{font:600 18px system-ui;fill:#173d2b}.small{font:15px system-ui;fill:#355746}.arrow{stroke:#d07835;stroke-width:5;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d07835"/></marker></defs><rect class="bg" width="960" height="560" rx="24"/><text class="h" x="48" y="54">Двойное оплодотворение</text><rect class="card" x="35" y="115" width="210" height="120" rx="18"/><text class="t" x="53" y="149">Пыльца n</text><text class="small" x="53" y="180">прорастание</text><text class="small" x="53" y="204">два спермия n</text><rect class="card" x="300" y="80" width="250" height="190" rx="18"/><text class="t" x="318" y="114">Зародышевый мешок</text><text class="small" x="318" y="145">яйцеклетка n</text><text class="small" x="318" y="169">центральная клетка 2n</text><text class="small" x="318" y="193">пыльцевая трубка</text><rect class="card" x="650" y="80" width="270" height="120" rx="18"/><text class="t" x="668" y="114">Зигота 2n</text><text class="small" x="668" y="145">спермий n + яйцеклетка n</text><text class="small" x="668" y="169">→ зародыш</text><rect class="card" x="650" y="285" width="270" height="120" rx="18"/><text class="t" x="668" y="319">Эндосперм 3n</text><text class="small" x="668" y="350">спермий n + центр. клетка 2n</text><text class="small" x="668" y="374">→ питательная ткань</text><rect class="card" x="300" y="350" width="250" height="110" rx="18"/><text class="t" x="318" y="384">Почему «двойное»?</text><text class="small" x="318" y="415">два разных слияния</text><text class="small" x="318" y="439">в одном семязачатке</text><path class="arrow" d="M245 175 L300 175"/><path class="arrow" d="M550 145 L650 140"/><path class="arrow" d="M550 215 C610 215 605 345 650 345"/></svg>
