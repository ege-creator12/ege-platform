<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 654" role="img" aria-labelledby="t d"><title id="t">Кровообращение пресмыкающихся</title><desc id="d">Смысловая структурная схема: Обычно три камеры: Два предсердия и желудочек с неполной перегородкой.; Частичное разделение потоков: По сравнению с земноводными смешение ограничено сильнее, но разделение обычно неполное.; Два круга: Лёгочный и большой круги; сохраняются две дуги аорты.; Исключение: крокодилы: Сердце четырёхкамерное, но особенности крупных сосудов позволяют перераспределять потоки.</desc><rect width="680" height="654" rx="20" fill="#fafbf8"/><g font-family="Arial,sans-serif" fill="#234c3c"><text x="28" y="40" font-size="26" font-weight="700">Кровообращение пресмыкающихся</text><text x="28" y="70" font-size="17" fill="#62776d">Структуры и связи · учебная схема</text><rect x="22" y="96" width="636" height="120" rx="16" fill="#e3efe8"/><text x="42" y="128" font-size="24" font-weight="700">Обычно три камеры</text><text x="42" y="161" font-size="22">Два предсердия и желудочек с неполной</text><text x="42" y="188" font-size="22">перегородкой.</text><rect x="22" y="230" width="636" height="120" rx="16" fill="#edf1e3"/><text x="42" y="262" font-size="24" font-weight="700">Частичное разделение потоков</text><text x="42" y="295" font-size="22">По сравнению с земноводными смешение ограничено</text><text x="42" y="322" font-size="22">сильнее, но разделение обычно неполное.</text><rect x="22" y="364" width="636" height="120" rx="16" fill="#e3efe8"/><text x="42" y="396" font-size="24" font-weight="700">Два круга</text><text x="42" y="429" font-size="22">Лёгочный и большой круги; сохраняются две дуги</text><text x="42" y="456" font-size="22">аорты.</text><rect x="22" y="498" width="636" height="120" rx="16" fill="#edf1e3"/><text x="42" y="530" font-size="24" font-weight="700">Исключение: крокодилы</text><text x="42" y="563" font-size="22">Сердце четырёхкамерное, но особенности крупных</text><text x="42" y="590" font-size="22">сосудов позволяют перераспределять потоки.</text></g></svg>
