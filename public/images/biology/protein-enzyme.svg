<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
<title id="title">Структура белка и работа фермента</title><desc id="desc">Слева показан переход от цепи аминокислот к свёрнутому белку, справа — связывание субстрата активным центром и выход продуктов.</desc>
<rect width="900" height="520" rx="28" fill="#f4fbf8"/><g font-family="Arial,sans-serif" fill="#173b34"><text x="45" y="55" font-size="28" font-weight="700">Сворачивание определяет функцию</text><text x="45" y="105" font-size="20">первичная структура</text><path d="M55 145 C105 90 145 200 205 140 S305 100 360 155" fill="none" stroke="#267c68" stroke-width="12" stroke-linecap="round"/><g fill="#f0a44b"><circle cx="70" cy="140" r="13"/><circle cx="120" cy="126" r="13"/><circle cx="174" cy="159" r="13"/><circle cx="235" cy="138" r="13"/><circle cx="300" cy="130" r="13"/></g><path d="M205 190v55" stroke="#173b34" stroke-width="4"/><path d="m190 230 15 18 15-18" fill="none" stroke="#173b34" stroke-width="4"/><text x="82" y="285" font-size="20">пространственная форма</text><path d="M80 345 C65 265 180 290 185 355 C195 420 90 440 75 370 C150 395 220 300 305 350 C370 390 280 465 210 420 C150 380 205 320 255 332" fill="#a7ddd0" stroke="#267c68" stroke-width="6"/><text x="475" y="55" font-size="28" font-weight="700">Ферментативный цикл</text><path d="M520 155 C470 200 485 335 590 350 C700 365 755 255 700 175 C660 120 600 140 575 195 L630 225 L675 190" fill="#a7ddd0" stroke="#267c68" stroke-width="6"/><path d="m596 192 35 25 38-28" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round"/><path d="m610 105 22 18 25-18 22 18-25 20-22-18-22 18-25-20z" fill="#f0a44b" stroke="#9d591e" stroke-width="4"/><path d="M632 145v38" stroke="#173b34" stroke-width="4"/><path d="m620 172 12 15 12-15" fill="none" stroke="#173b34" stroke-width="4"/><text x="540" y="90" font-size="19">субстрат</text><text x="520" y="405" font-size="19">активный центр связывает субстрат</text><path d="M725 365h75" stroke="#173b34" stroke-width="4"/><path d="m788 353 16 12-16 12" fill="none" stroke="#173b34" stroke-width="4"/><circle cx="830" cy="330" r="22" fill="#f0a44b"/><circle cx="855" cy="382" r="22" fill="#ffd18d"/><text x="790" y="430" font-size="19">продукты</text></g></svg>
