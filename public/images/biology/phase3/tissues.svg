<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet"><title id="title">Ткани человека</title><desc id="desc">Микроскопические модели эпителиальной, соединительной, мышечной и нервной тканей.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#244f49"/></marker><style>.t{font:600 16px Arial,sans-serif;fill:#173b35}.s{font:14px Arial,sans-serif;fill:#173b35}.lead{fill:none;stroke:#244f49;stroke-width:2}.flow{fill:none;stroke:#176b5b;stroke-width:4;marker-end:url(#arrow)}.organ{stroke:#244f49;stroke-width:3}.red{fill:#f7a4a4}.blue{fill:#9bc8ef}.cream{fill:#fff0c9}.green{fill:#b9e4d7}</style></defs><rect width="800" height="560" rx="22" fill="#f8fcfb"/><text x="400" y="36" text-anchor="middle" class="t" font-size="23">Ткани человека</text><g transform="translate(45 75)"><rect width="330" height="190" rx="15" class="organ cream"/><text x="15" y="25" class="t">Эпителиальная</text><g fill="#e88989" stroke="#783b3b"><rect x="20" y="70" width="43" height="70" rx="18"/><rect x="68" y="70" width="43" height="70" rx="18"/><rect x="116" y="70" width="43" height="70" rx="18"/><rect x="164" y="70" width="43" height="70" rx="18"/><rect x="212" y="70" width="43" height="70" rx="18"/><rect x="260" y="70" width="43" height="70" rx="18"/></g><text x="15" y="175" class="s">клетки тесно, вещества мало</text></g><g transform="translate(425 75)"><rect width="330" height="190" rx="15" class="organ green"/><text x="15" y="25" class="t">Соединительная</text><path d="M20 70 Q100 130 180 75T310 125" class="lead"/><circle cx="80" cy="105" r="14" fill="#815ba3"/><circle cx="230" cy="95" r="14" fill="#815ba3"/><text x="15" y="175" class="s">много матрикса и волокон</text></g><g transform="translate(45 310)"><rect width="330" height="190" rx="15" class="organ red"/><text x="15" y="25" class="t">Мышечная</text><path d="M20 80H310M20 105H310M20 130H310" stroke="#fff" stroke-width="12"/><path d="M40 65v85m35-85v85m35-85v85m35-85v85" stroke="#733"/><text x="15" y="175" class="s">удлинённые сократимые клетки</text></g><g transform="translate(425 310)"><rect width="330" height="190" rx="15" class="organ blue"/><text x="15" y="25" class="t">Нервная</text><circle cx="135" cy="100" r="34" fill="#f4c46f" stroke="#744"/><path d="M100 90L35 55M100 105L30 130M168 100H305" class="lead"/><text x="15" y="175" class="s">нейрон и отростки</text></g></svg>
