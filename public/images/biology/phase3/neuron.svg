<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet"><title id="title">Нейрон и синапс</title><desc id="desc">Нейрон с дендритами, телом, аксоном, миелином, окончаниями и химическим синапсом.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#244f49"/></marker><style>.t{font:600 16px Arial,sans-serif;fill:#173b35}.s{font:14px Arial,sans-serif;fill:#173b35}.lead{fill:none;stroke:#244f49;stroke-width:2}.flow{fill:none;stroke:#176b5b;stroke-width:4;marker-end:url(#arrow)}.organ{stroke:#244f49;stroke-width:3}.red{fill:#f7a4a4}.blue{fill:#9bc8ef}.cream{fill:#fff0c9}.green{fill:#b9e4d7}</style></defs><rect width="800" height="560" rx="22" fill="#f8fcfb"/><text x="400" y="36" text-anchor="middle" class="t" font-size="23">Нейрон и синапс</text><circle cx="190" cy="270" r="70" fill="#f0c36d" class="organ"/><circle cx="190" cy="270" r="24" fill="#8c609f"/><g class="lead"><path d="M145 225L50 120"/><path d="M145 225L70 138"/><path d="M145 225L90 156"/><path d="M145 225L110 174"/><path d="M145 225L130 192"/><path d="M145 225L150 210"/></g><path d="M260 270H665" stroke="#d9a54e" stroke-width="18"/><g fill="#e9edf1" stroke="#557"><rect x="290" y="245" width="55" height="50" rx="24"/><rect x="365" y="245" width="55" height="50" rx="24"/><rect x="440" y="245" width="55" height="50" rx="24"/><rect x="515" y="245" width="55" height="50" rx="24"/><rect x="590" y="245" width="55" height="50" rx="24"/></g><path d="M650 270Q710 230 735 190M650 270Q720 300 745 345" class="lead"/><circle cx="760" cy="190" r="18" fill="#70b89c"/><circle cx="770" cy="345" r="18" fill="#70b89c"/><path d="M735 190H755" stroke="#b86587" stroke-width="5" stroke-dasharray="4"/><text x="55" y="95" class="t">дендриты</text><text x="145" y="370" class="t">тело и ядро</text><text x="390" y="220" class="t">миелин</text><text x="460" y="33