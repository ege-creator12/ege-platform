<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet"><title id="title">Ворсинка тонкой кишки</title><desc id="desc">Продольный разрез ворсинки с однослойным эпителием, кровеносной сетью и центральным лимфатическим капилляром.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#244f49"/></marker><style>.t{font:600 16px Arial,sans-serif;fill:#173b35}.s{font:14px Arial,sans-serif;fill:#173b35}.lead{fill:none;stroke:#244f49;stroke-width:2}.flow{fill:none;stroke:#176b5b;stroke-width:4;marker-end:url(#arrow)}.organ{stroke:#244f49;stroke-width:3}.red{fill:#f7a4a4}.blue{fill:#9bc8ef}.cream{fill:#fff0c9}.green{fill:#b9e4d7}</style></defs><rect width="800" height="560" rx="22" fill="#f8fcfb"/><text x="400" y="36" text-anchor="middle" class="t" font-size="23">Ворсинка тонкой кишки</text><path d="M240 510Q215 250 300 100Q400 20 500 100Q585 250 560 510Z" fill="#f6c3ae" class="organ"/><path d="M400 465V155" stroke="#90c894" stroke-width="35"/><path d="M305 460Q270 280 340 140M495 460Q530 280 460 140M340 140Q400 105 460 140" fill="none" stroke="#d75f6a" stroke-width="13"/><g stroke="#704c45" stroke-width="3"><path d="M255 115l-10 -28"/><path d="M280 115l-10 -28"/><path d="M305 115l-10 -28"/><path d="M330 115l-10 -28"/><path d="M355 115l-10 -28"/><path d="M380 115l-10 -28"/><path d="M405 115l-10 -28"/><path d="M430 115l-10 -28"/><path d="M455 115l-10 -28"/><path d="M480 115l-10 -28"/><path d="M505 115l-10 -28"/><path d="M530 115l-10 -28"/></g><text x="35" y="120" class="t">микроворсинки</text><path d="M170 115H255" class="lead"/><text x="35" y="250" class="t">эпителий в 1 слой</text><path d="M180 245L255 255" class="lead"/><text x="555" y="230" class="t">кровеносные</text><text x="555" y="252" class="t">капилляры</text><path d="M550 250L490 275" class="lead"/><text x="500" y="420" class="t">лимфатически