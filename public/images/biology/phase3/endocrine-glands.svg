<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet"><title id="title">Эндокринные железы</title><desc id="desc">Положение гипофиза, щитовидной и паращитовидных желёз, надпочечников, поджелудочных островков и половых желёз.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#244f49"/></marker><style>.t{font:600 16px Arial,sans-serif;fill:#173b35}.s{font:14px Arial,sans-serif;fill:#173b35}.lead{fill:none;stroke:#244f49;stroke-width:2}.flow{fill:none;stroke:#176b5b;stroke-width:4;marker-end:url(#arrow)}.organ{stroke:#244f49;stroke-width:3}.red{fill:#f7a4a4}.blue{fill:#9bc8ef}.cream{fill:#fff0c9}.green{fill:#b9e4d7}</style></defs><rect width="800" height="560" rx="22" fill="#f8fcfb"/><text x="400" y="36" text-anchor="middle" class="t" font-size="23">Эндокринные железы</text><circle cx="400" cy="90" r="55" fill="#f2c5a5" class="organ"/><path d="M330 145Q270 210 295 430L330 520H470L505 430Q530 210 470 145Z" fill="#f6dfcf" class="organ"/><circle cx="400" cy="105" r="9" fill="#8f5ea2"/><path d="M370 175Q400 145 430 175Q420 215 400 195Q380 215 370 175Z" fill="#c96b8d"/><path d="M335 285q25-35 50 0M415 285q25-35 50 0" stroke="#e8ad4f" stroke-width="16"/><path d="M330 350Q400 320 470 350" stroke="#d7a05e" stroke-width="20"/><circle cx="365" cy="470" r="22" fill="#c96b8d"/><circle cx="435" cy="470" r="22" fill="#c96b8d"/><text x="470" y="95" class="t">гипофиз</text><text x="470" y="180" class="t">щитовидная</text><text x="515" y="285" class="t">надпочечники</text><text x="510" y="350" class="t">поджелудочная</text><text x="500" y="475" class="t">половые железы</text></svg>
