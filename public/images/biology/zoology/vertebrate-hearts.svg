<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" role="img" aria-labelledby="title desc"><title id="title">Камеры, круги, смешение</title><desc id="desc">Учебная схема ОСНОВА для подготовки к ЕГЭ: РЫБЫ: 2 камеры • 1 круг; ЗЕМНОВОДНЫЕ: 3 • 2 • смешение; ПРЕСМЫКАЮЩИЕСЯ: 3* • 2 • меньше смешения; ПТИЦЫ: 4 • 2 • нет смешения; МЛЕКОПИТАЮЩИЕ: 4 • 2 • нет смешения; * крокодилы — 4 камеры</desc><rect width="920" height="540" rx="28" fill="#FFFDF7"/><text x="460" y="64" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#173B3F">Камеры, круги, смешение</text><path d="M60 88 H860" stroke="#E9A23B" stroke-width="6" stroke-linecap="round"/><g><rect x="60" y="125" width="800" height="48" rx="16" fill="#F1F8EE" stroke="#39736A" stroke-width="2"/><text x="84" y="157" font-size="24" font-weight="700" fill="#173B3F">РЫБЫ: 2 камеры • 1 круг</text></g><g><rect x="60" y="183" width="800" height="48" rx="16" fill="#EAF4FF" stroke="#39736A" stroke-width="2"/><text x="84" y="215" font-size="24" font-weight="700" fill="#173B3F">ЗЕМНОВОДНЫЕ: 3 • 2 • смешение</text></g><g><rect x="60" y="241" width="800" height="48" rx="16" fill="#F1F8EE" stroke="#39736A" stroke-width="2"/><text x="84" y="273" font-size="24" font-weight="700" fill="#173B3F">ПРЕСМЫКАЮЩИЕСЯ: 3* • 2 • меньше смешения</text></g><g><rect x="60" y="299" width="800" height="48" rx="16" fill="#EAF4FF" stroke="#39736A" stroke-width="2"/><text x="84" y="331" font-size="24" font-weight="700" fill="#173B3F">ПТИЦЫ: 4 • 2 • нет смешения</text></g><g><rect x="60" y="357" width="800" height="48" rx="16" fill="#F1F8EE" stroke="#39736A" stroke-width="2"/><text x="84" y="389" font-size="24" font-weight="700" fill="#173B3F">МЛЕКОПИТАЮЩИЕ: 4 • 2 • нет смешения</text></g><g><rect x="60" y="415" width="800" height="48" rx="16" fill="#EAF4FF" stroke="#39736A" stroke-width="2"/><text x="84" y="447" font-size="24" font-weight="500" fill="#173B3F">* крокодилы — 4 камеры</text></g><text x="860" y="516" text-anchor="end" font-family="Arial,sans-serif" font-size="16" fill="#557276">ОСНОВА · ЕГЭ 2027</text></svg>
