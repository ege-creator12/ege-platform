<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet"><title id="title">Нефрон</title><desc id="desc">Строение нефрона с клубочком в капсуле, артериолами, канальцами, петлёй, собирательной трубочкой и перитубулярными капиллярами.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#244f49"/></marker><style>.t{font:600 16px Arial,sans-serif;fill:#173b35}.s{font:14px Arial,sans-serif;fill:#173b35}.lead{fill:none;stroke:#244f49;stroke-width:2}.flow{fill:none;stroke:#176b5b;stroke-width:4;marker-end:url(#arrow)}.organ{stroke:#244f49;stroke-width:3}.red{fill:#f7a4a4}.blue{fill:#9bc8ef}.cream{fill:#fff0c9}.green{fill:#b9e4d7}</style></defs><rect width="800" height="580" rx="22" fill="#f8fcfb"/><text x="400" y="36" text-anchor="middle" class="t" font-size="23">Нефрон</text><circle cx="230" cy="145" r="85" fill="#fff0c9" class="organ"/><path d="M180 145Q210 80 265 125Q300 170 245 195Q190 205 170 160" fill="none" stroke="#d85f65" stroke-width="16"/><path d="M45 120H170M270 120H365" stroke="#d85f65" stroke-width="16"/><path d="M290 180Q410 155 410 255V440Q410 505 350 505Q290 505 290 440V300Q290 255 355 255Q500 255 510 180" fill="none" stroke="#d9a849" stroke-width="18"/><path d="M510 180Q560 160 600 210V500" fill="none" stroke="#d9a849" stroke-width="18"/><path d="M345 145Q485 115 520 260Q540 410 455 480" fill="none" stroke="#8dbbe2" stroke-width="10" stroke-dasharray="12 7"/><path d="M210 165L305 210" class="flow"/><text x="55" y="95" class="t">приносящая</text><text x="55" y="115" class="t">артериола</text><text x="280" y="80" class="t">клубочек в капсуле</text><text x="370" y="140" class="t">выносящая артериола</text><text x="410" y="235" class="t">проксимальный</text><text x="210" y="430" class="t">петля нефрона</text><text x="525" y="160" class="t">дистальный</text><text x="610" y="390" class="t">собирательная</text><text x="610" y="412" class="t">трубочка</text><text x="470" y="520" class="s">синяя сеть: реабсорбция в кровь</text></svg>
