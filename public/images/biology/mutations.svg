<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="title desc"><title id="title">Уровни мутаций</title><desc id="desc">Оригинальная учебная схема ОСНОВЫ: генные: замена, ±нуклеотид, хромосомные: перестройка, геномные: число хромосом, тип клетки → наследование</desc><style>.head{font:700 28px system-ui,sans-serif;fill:#173f35}.line{font:600 21px system-ui,sans-serif;fill:#173f35}</style><rect width="760" height="440" rx="28" fill="#f7fcfa"/><text x="380" y="48" text-anchor="middle" class="head">Уровни мутаций</text><g><rect x="70" y="80" width="620" height="58" rx="18" fill="#dff4ec" stroke="#25745f" stroke-width="3"/><text x="380" y="117" text-anchor="middle" class="line">генные: замена, ±нуклеотид</text></g><g><rect x="70" y="162" width="620" height="58" rx="18" fill="#fff2df" stroke="#25745f" stroke-width="3"/><text x="380" y="199" text-anchor="middle" class="line">хромосомные: перестройка</text></g><g><rect x="70" y="244" width="620" height="58" rx="18" fill="#dff4ec" stroke="#25745f" stroke-width="3"/><text x="380" y="281" text-anchor="middle" class="line">геномные: число хромосом</text></g><g><rect x="70" y="326" width="620" height="58" rx="18" fill="#fff2df" stroke="#25745f" stroke-width="3"/><text x="380" y="363" text-anchor="middle" class="line">тип клетки → наследование</text></g></svg>