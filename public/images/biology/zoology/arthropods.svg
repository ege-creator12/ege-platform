<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" role="img" aria-labelledby="title desc"><title id="title">Членистоногие: считайте признаки</title><desc id="desc">Учебная схема ОСНОВА для подготовки к ЕГЭ: РАКООБРАЗНЫЕ; 2 пары усиков • жабры; ПАУКООБРАЗНЫЕ; усиков нет • 4 пары ног; НАСЕКОМЫЕ; 1 пара усиков • 3 пары ног</desc><rect width="920" height="540" rx="28" fill="#FFFDF7"/><text x="460" y="64" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#173B3F">Членистоногие: считайте признаки</text><path d="M60 88 H860" stroke="#E9A23B" stroke-width="6" stroke-linecap="round"/><g><rect x="60" y="125" width="800" height="48" rx="16" fill="#F1F8EE" stroke="#39736A" stroke-width="2"/><text x="84" y="157" font-size="24" font-weight="700" fill="#173B3F">РАКООБРАЗНЫЕ</text></g><g><rect x="60" y="183" width="800" height="48" rx="16" fill="#EAF4FF" stroke="#39736A" stroke-width="2"/><text x="84" y="215" font-size="24" font-weight="500" fill="#173B3F">2 пары усиков • жабры</text></g><g><rect x="60" y="241" width="800" height="48" rx="16" fill="#F1F8EE" stroke="#39736A" stroke-width="2"/><text x="84" y="273" font-size="24" font-weight="700" fill="#173B3F">ПАУКООБРАЗНЫЕ</text></g><g><rect x="60" y="299" width="800" height="48" rx="16" fill="#EAF4FF" stroke="#39736A" stroke-width="2"/><text x="84" y="331" font-size="24" font-weight="500" fill="#173B3F">усиков нет • 4 пары ног</text></g><g><rect x="60" y="357" width="800" height="48" rx="16" fill="#F1F8EE" stroke="#39736A" stroke-width="2"/><text x="84" y="389" font-size="24" font-weight="700" fill="#173B3F">НАСЕКОМЫЕ</text></g><g><rect x="60" y="415" width="800" height="48" rx="16" fill="#EAF4FF" stroke="#39736A" stroke-width="2"/><text x="84" y="447" font-size="24" font-weight="500" fill="#173B3F">1 пара усиков • 3 пары ног</text></g><text x="860" y="516" text-anchor="end" font-family="Arial,sans-serif" font-size="16" fill="#557276">ОСНОВА · ЕГЭ 2027</text></svg>
