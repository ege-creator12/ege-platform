<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 370" role="img" aria-labelledby="t d"><title id="t">Схема нефрона</title><desc id="d">1 — сосудистый клубочек внутри чашеобразной капсулы 2. От капсулы начинается извитой каналец 3, переходящий в длинную U-образную петлю 4, затем в извитой отдел 5. Он впадает в вертикальную трубку 6. Стрелки показывают движение фильтрата по трубке.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#235840"/></marker></defs><rect width="620" height="370" rx="20" fill="#f5f8f5"/><path d="M70 110Q65 54 119 54Q174 54 168 110L190 116" fill="none" stroke="#9c773f" stroke-width="10"/><path d="M76 37L100 79C71 107 159 123 145 84C130 53 87 97 112 105C134 115 165 82 146 71L160 35" fill="none" stroke="#be605e" stroke-width="7"/><path d="M169 111C205 94 200 61 225 69C252 78 217 119 250 122C285 123 250 73 281 76C310 79 287 136 298 161L298 267Q326 326 357 268V146C357 109 386 100 393 128C401 158 424 132 412 109C400 84 428 75 443 107L482 111 M483 57V321" fill="none" stroke="#b79855" stroke-width="12" stroke-linecap="round"/><g stroke="#235840" stroke-width="2" marker-end="url(#a)"><path d="M298 175V212 M357 228V184 M483 209V252"/></g><g font-family="sans-serif" font-size="24" fill="#183f30" font-weight="700"><text x="110" y="47">1</text><text x="34" y="124">2</text><text x="232" y="47">3</text><text x="319" y="344">4</text><text x="407" y="59">5</text><text x="507" y="176">6</text></g><text x="315" y="362" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#52645c">Условная схема; сосуды вокруг канальцев не показаны</text></svg>
