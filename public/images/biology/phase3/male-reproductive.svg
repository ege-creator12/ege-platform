<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet"><title id="title">Мужская половая система</title><desc id="desc">Схематическое взаимное расположение семенников, придатков, семявыносящих протоков, добавочных желёз и мочеиспускательного канала.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#244f49"/></marker><style>.t{font:600 16px Arial,sans-serif;fill:#173b35}.s{font:14px Arial,sans-serif;fill:#173b35}.lead{fill:none;stroke:#244f49;stroke-width:2}.flow{fill:none;stroke:#176b5b;stroke-width:4;marker-end:url(#arrow)}.organ{stroke:#244f49;stroke-width:3}.red{fill:#f7a4a4}.blue{fill:#9bc8ef}.cream{fill:#fff0c9}.green{fill:#b9e4d7}</style></defs><rect width="800" height="580" rx="22" fill="#f8fcfb"/><text x="400" y="36" text-anchor="middle" class="t" font-size="23">Мужская половая система</text><ellipse cx="400" cy="155" rx="105" ry="85" fill="#e7c68e" class="organ"/><path d="M330 175Q225 235 270 390M470 175Q575 235 530 390" fill="none" stroke="#6f9db2" stroke-width="15"/><ellipse cx="300" cy="430" rx="55" ry="75" fill="#e8ad79" class="organ"/><ellipse cx="500" cy="430" rx="55" ry="75" fill="#e8ad79" class="organ"/><path d="M255 410Q220 430 260 485M545 410Q580 430 540 485" fill="none" stroke="#b47d8f" stroke-width="15"/><path d="M350 220Q400 245 450 220" stroke="#c38a58" stroke-width="25"/><ellipse cx="400" cy="285" rx="65" ry="35" fill="#c58d65" class="organ"/><path d="M400 320V530" stroke="#d3a172" stroke-width="20"/><text x="80" y="155" class="t">мочевой пузырь</text><path d="M240 150H295" class="lead"/><text x="45" y="300" class="t">семявыносящий проток</text><path d="M240 295L280 265" class="lead"/><text x="575" y="245" class="t">семенные пузырьки</text><text x="500" y="310" class="t">простата</text><text x="80" y="450" class="t">семенник и придаток</text><text x="430" y="545" class="t">мочеиспускательный канал</text></svg>
