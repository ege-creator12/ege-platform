<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet"><title id="title">Спинной мозг и корешки</title><desc id="desc">Поперечный срез спинного мозга: серое и белое вещество, центральный канал, чувствительный задний и двигательный передний корешки.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#244f49"/></marker><style>.t{font:600 16px Arial,sans-serif;fill:#173b35}.s{font:14px Arial,sans-serif;fill:#173b35}.lead{fill:none;stroke:#244f49;stroke-width:2}.flow{fill:none;stroke:#176b5b;stroke-width:4;marker-end:url(#arrow)}.organ{stroke:#244f49;stroke-width:3}.red{fill:#f7a4a4}.blue{fill:#9bc8ef}.cream{fill:#fff0c9}.green{fill:#b9e4d7}</style></defs><rect width="800" height="560" rx="22" fill="#f8fcfb"/><text x="400" y="36" text-anchor="middle" class="t" font-size="23">Спинной мозг и корешки</text><ellipse cx="400" cy="280" rx="190" ry="220" fill="#eee5d9" class="organ"/><path d="M400 160Q330 90 315 200Q250 230 330 285Q250 345 330 385Q365 420 400 350Q435 420 470 385Q550 345 470 285Q550 230 485 200Q470 90 400 160Z" fill="#8d6a9d"/><circle cx="400" cy="280" r="13" fill="#fff"/><path d="M250 200Q140 135 75 200M250 355Q140 425 75 355" class="lead"/><circle cx="150" cy="160" r="24" fill="#809fd0"/><path d="M75 200V355" stroke="#557" stroke-width="10"/><text x="310" y="75" class="t">белое вещество снаружи</text><text x="330" y="280" class="t">серое</text><text x="420" y="305" class="s">канал</text><text x="45" y="120" class="t">задний чувствительный корешок</text><text x="45" y="460" class="t">передний двигательный корешок</text><text x="45" y="285" class="t">спинномозговой нерв</text></svg>
