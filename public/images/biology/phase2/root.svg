<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 761" role="img" aria-labelledby="t d"><title id="t">Зоны корня: от верхушки к стеблю</title><desc id="d">Смысловая структурная схема: Корневой чехлик: Защищает верхушечную меристему и облегчает продвижение корня в почве.; Зона деления: Меристематические клетки интенсивно делятся митозом.; Зона растяжения: Увеличение размеров клеток удлиняет корень.; Зона всасывания: Корневые волоски увеличивают поверхность поглощения воды и ионов.; Зона проведения: Проводящие ткани связывают корень с побегом; формируются боковые корни.</desc><rect width="680" height="761" rx="20" fill="#fafbf8"/><g font-family="Arial,sans-serif" fill="#234c3c"><text x="28" y="40" font-size="26" font-weight="700">Зоны корня: от верхушки к стеблю</text><text x="28" y="70" font-size="17" fill="#62776d">Структуры и связи · учебная схема</text><rect x="22" y="96" width="636" height="120" rx="16" fill="#e3efe8"/><text x="42" y="128" font-size="24" font-weight="700">Корневой чехлик</text><text x="42" y="161" font-size="22">Защищает верхушечную меристему и облегчает</text><text x="42" y="188" font-size="22">продвижение корня в почве.</text><rect x="22" y="230" width="636" height="120" rx="16" fill="#edf1e3"/><text x="42" y="262" font-size="24" font-weight="700">Зона деления</text><text x="42" y="295" font-size="22">Меристематические клетки интенсивно делятся</text><text x="42" y="322" font-size="22">митозом.</text><rect x="22" y="364" width="636" height="93" rx="16" fill="#e3efe8"/><text x="42" y="396" font-size="24" font-weight="700">Зона растяжения</text><text x="42" y="429" font-size="22">Увеличение размеров клеток удлиняет корень.</text><rect x="22" y="471" width="636" height="120" rx="16" fill="#edf1e3"/><text x="42" y="503" font-size="24" font-weight="700">Зона всасывания</text><text x="42" y="536" font-size="22">Корневые волоски увеличивают поверхность</text><text x="42" y="563" font-size="22">поглощения воды и ионов.</text><rect x="22" y="605" width="636" height="120" rx="16" fill="#e3efe8"/><text x="42" y="637" font-size="24" font-weight="700">Зона проведения</text><text x="42" y="670" font-size="22">Проводящие ткани связывают корень с побегом;</text><text x="42" y="697" font-size="22">формируются боковые корни.</text></g></svg>
