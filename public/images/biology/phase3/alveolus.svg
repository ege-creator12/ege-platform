<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet"><title id="title">Альвеола и аэрогематический барьер</title><desc id="desc">Разрез альвеолы с воздушной полостью, однослойной стенкой и окружающим капилляром с эритроцитами; показана диффузия O₂ и CO₂.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#244f49"/></marker><style>.t{font:600 16px Arial,sans-serif;fill:#173b35}.s{font:14px Arial,sans-serif;fill:#173b35}.lead{fill:none;stroke:#244f49;stroke-width:2}.flow{fill:none;stroke:#176b5b;stroke-width:4;marker-end:url(#arrow)}.organ{stroke:#244f49;stroke-width:3}.red{fill:#f7a4a4}.blue{fill:#9bc8ef}.cream{fill:#fff0c9}.green{fill:#b9e4d7}</style></defs><rect width="800" height="560" rx="22" fill="#f8fcfb"/><text x="400" y="36" text-anchor="middle" class="t" font-size="23">Альвеола и аэрогематический барьер</text><circle cx="300" cy="280" r="180" fill="#fff5d8" stroke="#d88a77" stroke-width="8"/><text x="220" y="275" class="t">полость альвеолы</text><path d="M450 125Q650 150 650 300Q650 450 430 455" fill="none" stroke="#82b8df" stroke-width="55"/><g fill="#df6666"><ellipse cx="500" cy="190" rx="25" ry="15"/><ellipse cx="542" cy="265" rx="25" ry="15"/><ellipse cx="584" cy="340" rx="25" ry="15"/><ellipse cx="626" cy="190" rx="25" ry="15"/></g><path d="M380 225L510 225" class="flow"/><text x="400" y="205" class="t">O₂</text><path d="M520 340L385 340" class="flow"/><text x="420" y="380" class="t">CO₂</text><path d="M130 105L190 155" class="lead"/><text x="30" y="95" class="t">тонкая влажная стенка</text><text x="555" y="115" class="t">капилляр</text><text x="570" y="475" class="t">эритроциты</text><path d="M445 185V375" stroke="#7f5b5b" stroke-width="3" stroke-dasharray="7 5"/><text x="455" y="410" class="s">аэрогематический барьер</text></svg>
