<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc"><title id="title">Доказательства эволюции и чтение филогенетических деревьев</title><desc id="desc">Учебная схема: Ископаемые; Анатомия и развитие; ДНК и белки; Согласованное дерево. Стрелки показывают причинную или историческую последовательность.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#334155"/></marker><linearGradient id="bg"><stop stop-color="#f0fdf4"/><stop offset="1" stop-color="#eff6ff"/></linearGradient></defs><style>.bg{fill:url(#bg)}.card{stroke:#334155;stroke-width:2}.c0{fill:#dcfce7}.c1{fill:#fef3c7}.c2{fill:#dbeafe}.c3{fill:#f3e8ff}.badge,.node{fill:#fff;stroke:#166534;stroke-width:3}.num{font:bold 20px system-ui;fill:#14532d}text{font:17px system-ui,sans-serif;fill:#172033}.card+text{}.arrow{stroke:#334155;stroke-width:3;marker-end:url(#a)}.branch{fill:none;stroke:#166534;stroke-width:9;stroke-linecap:round}.branch.alt{stroke:#2563eb;stroke-width:6}</style><rect class="bg" width="920" height="520" rx="28"/><text x="460" y="58" text-anchor="middle" style="font:bold 25px system-ui;fill:#123">Доказательства эволюции и чтение филогенетических деревьев</text><path d="M110 430 Q250 330 330 220 T680 90" class="branch"/><path d="M285 270 Q420 300 520 410" class="branch alt"/><path d="M430 180 Q560 220 690 320" class="branch alt"/><g transform="translate(70 440)"><circle r="13" class="node"/><text x="0" y="34" text-anchor="middle">Ископаемые</text></g><g transform="translate(260 280)"><circle r="13" class="node"/><text x="0" y="34" text-anchor="middle">Анатомия и развитие</text></g><g transform="translate(485 160)"><circle r="13" class="node"/><text x="0" y="34" text-anchor="middle">ДНК и белки</text></g><g transform="translate(665 80)"><circle r="13" class="node"/><text x="0" y="34" text-anchor="middle">Согласованное дерево</text></g><text x="460" y="490" text-anchor="middle" style="font:15px system-ui;fill:#475569">Читайте стрелки как «исходное состояние → механизм → следствие»</text></svg>