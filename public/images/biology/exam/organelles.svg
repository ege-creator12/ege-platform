<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" role="img" aria-labelledby="t d"><title id="t">Три клеточные структуры</title><desc id="d">Структура 1: две оболочки, внутренняя образует складки. Структура 2: две оболочки, внутри стопки дисков. Структура 3: стопка изогнутых уплощённых мешочков с пузырьками по краям.</desc><rect width="640" height="290" rx="20" fill="#f5f8f5"/><g stroke="#275d4c" stroke-width="3" fill="#d4eadf"><ellipse cx="114" cy="131" rx="83" ry="55"/><path d="M42 132 Q48 84 81 93 L85 144 L102 102 L118 164 L135 103 L151 148 L165 110 Q190 157 153 168 Q78 186 42 132" fill="#f9faf5"/><ellipse cx="330" cy="131" rx="88" ry="58"/><ellipse cx="330" cy="131" rx="79" ry="49" fill="#f9faf5"/><path d="M275 153H385 M275 123H385"/><path d="M272 105h35v12h-35z M272 122h35v12h-35z M272 139h35v12h-35z M348 105h35v12h-35z M348 122h35v12h-35z M348 139h35v12h-35z"/><path d="M467 96 Q530 118 589 96 L584 106 Q530 134 472 106Z M475 119 Q530 143 581 119 L576 130 Q530 151 480 130Z M484 141 Q530 161 572 141 L566 153 Q530 170 490 153Z M493 164 Q531 178 562 164 L558 175 Q531 188 497 175Z"/><circle cx="466" cy="157" r="9"/><circle cx="594" cy="140" r="8"/><circle cx="582" cy="186" r="10"/></g><g fill="#193e32" font-family="sans-serif" font-size="26" font-weight="700" text-anchor="middle"><text x="114" y="234">1</text><text x="330" y="234">2</text><text x="530" y="234">3</text></g><text x="320" y="270" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#52645c">Условные схемы; масштаб не соблюдён</text></svg>
