<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-labelledby="title desc"><title id="title">Строение вируса</title><desc id="desc">Геном, Капсид, Оболочка у некоторых, Белки-рецепторы</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6Z" fill="#334155"/></marker></defs><rect width="920" height="420" rx="28" fill="#f8fafc"/><text x="460" y="75" text-anchor="middle" font-size="34" font-family="Arial" font-weight="700" fill="#0f172a">Строение вируса</text><g font-family="Arial"><rect x="55" y="160" width="160" height="120" rx="20" fill="#dbeafe" stroke="#334155" stroke-width="3"/><text x="135" y="215" text-anchor="middle" font-size="20" font-weight="700" fill="#172554">Геном</text><path d="M220 220 H260" stroke="#334155" stroke-width="5" marker-end="url(#a)"/><rect x="270" y="160" width="160" height="120" rx="20" fill="#dcfce7" stroke="#334155" stroke-width="3"/><text x="350" y="215" text-anchor="middle" font-size="20" font-weight="700" fill="#172554">Капсид</text><path d="M435 220 H475" stroke="#334155" stroke-width="5" marker-end="url(#a)"/><rect x="485" y="160" width="160" height="120" rx="20" fill="#fef3c7" stroke="#334155" stroke-width="3"/><text x="565" y="215" text-anchor="middle" font-size="20" font-weight="700" fill="#172554">Оболочка у некоторых</text><path d="M650 220 H690" stroke="#334155" stroke-width="5" marker-end="url(#a)"/><rect x="700" y="160" width="160" height="120" rx="20" fill="#f3e8ff" stroke="#334155" stroke-width="3"/><text x="780" y="215" text-anchor="middle" font-size="20" font-weight="700" fill="#172554">Белки-рецепторы</text></g><text x="460" y="355" text-anchor="middle" font-size="20" font-family="Arial" fill="#475569">Читайте схему слева направо</text></svg>