<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet"><title id="title">Женская половая система</title><desc id="desc">Фронтальная схема яичников, маточных труб, матки с эндометрием, шейки и влагалища.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#244f49"/></marker><style>.t{font:600 16px Arial,sans-serif;fill:#173b35}.s{font:14px Arial,sans-serif;fill:#173b35}.lead{fill:none;stroke:#244f49;stroke-width:2}.flow{fill:none;stroke:#176b5b;stroke-width:4;marker-end:url(#arrow)}.organ{stroke:#244f49;stroke-width:3}.red{fill:#f7a4a4}.blue{fill:#9bc8ef}.cream{fill:#fff0c9}.green{fill:#b9e4d7}</style></defs><rect width="800" height="560" rx="22" fill="#f8fcfb"/><text x="400" y="36" text-anchor="middle" class="t" font-size="23">Женская половая система</text><path d="M310 175Q400 115 490 175V380Q400 450 310 380Z" fill="#e99aa5" class="organ"/><path d="M340 195Q400 160 460 195V355Q400 390 340 355Z" fill="#ffe0d5" stroke="#8c565d" stroke-width="6"/><path d="M310 190Q220 100 125 180M490 190Q580 100 675 180" fill="none" stroke="#df8b9b" stroke-width="22"/><ellipse cx="105" cy="190" rx="48" ry="65" fill="#e6ad68" class="organ"/><ellipse cx="695" cy="190" rx="48" ry="65" fill="#e6ad68" class="organ"/><path d="M370 410Q400 445 430 410V510H370Z" fill="#e6a7a7" class="organ"/><text x="35" y="90" class="t">яичник</text><path d="M95 95L105 130" class="lead"/><text x="175" y="85" class="t">маточная труба</text><path d="M260 90L225 135" class="lead"/><text x="520" y="330" class="t">матка</text><path d="M515 325L460 320" class="lead"/><text x="520" y="365" class="t">эндометрий</text><text x="445" y="450" class="t">шейка</text><text x="435" y="530" class="t">влагалище</text></svg>
