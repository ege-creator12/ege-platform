<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet"><title id="title">Дыхательная система</title><desc id="desc">Анатомическая схема дыхательных путей, двух лёгких, бронхиального дерева, альвеол и диафрагмы.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#244f49"/></marker><style>.t{font:600 16px Arial,sans-serif;fill:#173b35}.s{font:14px Arial,sans-serif;fill:#173b35}.lead{fill:none;stroke:#244f49;stroke-width:2}.flow{fill:none;stroke:#176b5b;stroke-width:4;marker-end:url(#arrow)}.organ{stroke:#244f49;stroke-width:3}.red{fill:#f7a4a4}.blue{fill:#9bc8ef}.cream{fill:#fff0c9}.green{fill:#b9e4d7}</style></defs><rect width="800" height="580" rx="22" fill="#f8fcfb"/><text x="400" y="36" text-anchor="middle" class="t" font-size="23">Дыхательная система</text><path d="M390 70Q330 75 340 125Q350 155 390 165V235" fill="#f4c6a5" class="organ"/><path d="M390 165V255" stroke="#70a9bf" stroke-width="28"/><path d="M390 250L315 310M390 250L485 310" stroke="#70a9bf" stroke-width="22"/><path d="M345 230Q210 210 145 315Q95 440 220 500Q330 520 360 405Z" fill="#f0a2aa" class="organ"/><path d="M435 230Q570 210 655 315Q705 440 580 500Q465 520 420 405Z" fill="#f0a2aa" class="organ"/><g stroke="#fff" stroke-width="7"><path d="M315 305L250 365L210 425M315 305L325 400"/><path d="M485 305L550 365L600 425M485 305L465 400"/></g><path d="M120 515Q400 465 680 515" stroke="#5f8184" stroke-width="15" fill="none"/><text x="430" y="105" class="t">носовая полость</text><text x="420" y="190" class="t">гортань</text><text x="420" y="235" class="t">трахея</text><text x="125" y="285" class="t">бронхи</text><text x="600" y="430" class="t">альвеолы</text><text x="335" y="550" class="t">диафрагма</text></svg>
