<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet"><title id="title">Плацента и два кровотока</title><desc id="desc">Разрез плаценты: материнские межворсинчатые пространства, ворсины хориона с плодными капиллярами, пуповина и направления обмена без смешения крови.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#244f49"/></marker><style>.t{font:600 16px Arial,sans-serif;fill:#173b35}.s{font:14px Arial,sans-serif;fill:#173b35}.lead{fill:none;stroke:#244f49;stroke-width:2}.flow{fill:none;stroke:#176b5b;stroke-width:4;marker-end:url(#arrow)}.organ{stroke:#244f49;stroke-width:3}.red{fill:#f7a4a4}.blue{fill:#9bc8ef}.cream{fill:#fff0c9}.green{fill:#b9e4d7}</style></defs><rect width="800" height="560" rx="22" fill="#f8fcfb"/><text x="400" y="36" text-anchor="middle" class="t" font-size="23">Плацента и два кровотока</text><path d="M80 100Q400 35 720 100V470Q400 535 80 470Z" fill="#efb2b2" class="organ"/><path d="M110 145H690V425H110Z" fill="#c95f6c" opacity=".45"/><g fill="#f7d4c6" stroke="#7e5353" stroke-width="4"><path d="M180 115V220Q140 290 190 380Q240 290 205 215Z"/><path d="M290 115V220Q250 290 300 380Q350 290 315 215Z"/><path d="M400 115V220Q360 290 410 380Q460 290 425 215Z"/><path d="M510 115V220Q470 290 520 380Q570 290 535 215Z"/><path d="M620 115V220Q580 290 630 380Q680 290 645 215Z"/></g><g stroke="#527fb1" stroke-width="9" fill="none"><path d="M190 130V345Q165 360 200 375"/><path d="M300 130V345Q275 360 310 375"/><path d="M410 130V345Q385 360 420 375"/><path d="M520 130V345Q495 360 530 375"/><path d="M630 130V345Q605 360 640 375"/></g><path d="M400 105V30" stroke="#d7b37b" stroke-width="38"/><path d="M300 280H230" class="flow"/><text x="300" y="260" class="t">O₂, питание → плод</text><path d="M500 340H575" class="flow"/><text x="455" y="375" class="t">CO₂, продукты → мать</text><text x="35" y="85" class="t">материнская кровь</text><text x="520" y="75" class="t">пуповина</text><text x="85" y="520" class="t">ворсины хориона; внутри — сосуды плода</text><text x="495" y="520" class="t">кровь не смешивается</text></svg>
