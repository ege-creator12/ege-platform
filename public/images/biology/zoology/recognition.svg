<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" role="img" aria-labelledby="title desc"><title id="title">Определитель по рисунку</title><desc id="desc">Учебная схема ОСНОВА для подготовки к ЕГЭ: 1  клетка или многоклеточное тело?; 2  симметрия и сегментация?; 3  отделы тела, ноги, усики?; 4  покров и орган дыхания?; 5  подтвердите по двум признакам</desc><rect width="920" height="540" rx="28" fill="#FFFDF7"/><text x="460" y="64" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#173B3F">Определитель по рисунку</text><path d="M60 88 H860" stroke="#E9A23B" stroke-width="6" stroke-linecap="round"/><g><rect x="60" y="125" width="800" height="60" rx="16" fill="#F1F8EE" stroke="#39736A" stroke-width="2"/><text x="84" y="163" font-size="24" font-weight="500" fill="#173B3F">1  клетка или многоклеточное тело?</text></g><g><rect x="60" y="195" width="800" height="60" rx="16" fill="#EAF4FF" stroke="#39736A" stroke-width="2"/><text x="84" y="233" font-size="24" font-weight="500" fill="#173B3F">2  симметрия и сегментация?</text></g><g><rect x="60" y="265" width="800" height="60" rx="16" fill="#F1F8EE" stroke="#39736A" stroke-width="2"/><text x="84" y="303" font-size="24" font-weight="500" fill="#173B3F">3  отделы тела, ноги, усики?</text></g><g><rect x="60" y="335" width="800" height="60" rx="16" fill="#EAF4FF" stroke="#39736A" stroke-width="2"/><text x="84" y="373" font-size="24" font-weight="500" fill="#173B3F">4  покров и орган дыхания?</text></g><g><rect x="60" y="405" width="800" height="60" rx="16" fill="#F1F8EE" stroke="#39736A" stroke-width="2"/><text x="84" y="443" font-size="24" font-weight="500" fill="#173B3F">5  подтвердите по двум признакам</text></g><text x="860" y="516" text-anchor="end" font-family="Arial,sans-serif" font-size="16" fill="#557276">ОСНОВА · ЕГЭ 2027</text></svg>
