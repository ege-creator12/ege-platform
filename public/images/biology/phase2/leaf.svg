<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 815" role="img" aria-labelledby="t d"><title id="t">Лист: ткани и газообмен</title><desc id="d">Смысловая структурная схема: Эпидерма и кутикула: Покровная ткань и наружный слой ограничивают потерю воды и защищают лист.; Столбчатый мезофилл: Плотно расположенные клетки с хлоропластами; активный фотосинтез.; Губчатый мезофилл: Межклетники облегчают распространение газов внутри листа.; Жилка: Ксилема приносит воду и ионы, флоэма переносит органические вещества от источника к потребителям.; Устьичный аппарат: Замыкающие клетки регулируют щель; через неё идут газообмен и транспирация.</desc><rect width="680" height="815" rx="20" fill="#fafbf8"/><g font-family="Arial,sans-serif" fill="#234c3c"><text x="28" y="40" font-size="26" font-weight="700">Лист: ткани и газообмен</text><text x="28" y="70" font-size="17" fill="#62776d">Структуры и связи · учебная схема</text><rect x="22" y="96" width="636" height="120" rx="16" fill="#e3efe8"/><text x="42" y="128" font-size="24" font-weight="700">Эпидерма и кутикула</text><text x="42" y="161" font-size="22">Покровная ткань и наружный слой ограничивают</text><text x="42" y="188" font-size="22">потерю воды и защищают лист.</text><rect x="22" y="230" width="636" height="120" rx="16" fill="#edf1e3"/><text x="42" y="262" font-size="24" font-weight="700">Столбчатый мезофилл</text><text x="42" y="295" font-size="22">Плотно расположенные клетки с хлоропластами;</text><text x="42" y="322" font-size="22">активный фотосинтез.</text><rect x="22" y="364" width="636" height="120" rx="16" fill="#e3efe8"/><text x="42" y="396" font-size="24" font-weight="700">Губчатый мезофилл</text><text x="42" y="429" font-size="22">Межклетники облегчают распространение газов</text><text x="42" y="456" font-size="22">внутри листа.</text><rect x="22" y="498" width="636" height="147" rx="16" fill="#edf1e3"/><text x="42" y="530" font-size="24" font-weight="700">Жилка</text><text x="42" y="563" font-size="22">Ксилема приносит воду и ионы, флоэма переносит</text><text x="42" y="590" font-size="22">органические вещества от источника к</text><text x="42" y="617" font-size="22">потребителям.</text><rect x="22" y="659" width="636" height="120" rx="16" fill="#e3efe8"/><text x="42" y="691" font-size="24" font-weight="700">Устьичный аппарат</text><text x="42" y="724" font-size="22">Замыкающие клетки регулируют щель; через неё идут</text><text x="42" y="751" font-size="22">газообмен и транспирация.</text></g></svg>
