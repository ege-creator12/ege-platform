<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet"><title id="title">Строение и ток крови через сердце</title><desc id="desc">Фронтальная учебная схема четырёх камер, перегородки, клапанов и магистральных сосудов; правая половина показана слева для наблюдателя.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#244f49"/></marker><style>.t{font:600 16px Arial,sans-serif;fill:#173b35}.s{font:14px Arial,sans-serif;fill:#173b35}.lead{fill:none;stroke:#244f49;stroke-width:2}.flow{fill:none;stroke:#176b5b;stroke-width:4;marker-end:url(#arrow)}.organ{stroke:#244f49;stroke-width:3}.red{fill:#f7a4a4}.blue{fill:#9bc8ef}.cream{fill:#fff0c9}.green{fill:#b9e4d7}</style></defs><rect width="800" height="580" rx="22" fill="#f8fcfb"/><text x="400" y="36" text-anchor="middle" class="t" font-size="23">Строение и ток крови через сердце</text><path d="M400 115Q300 55 225 135Q130 235 235 405Q310 500 400 530Q490 500 565 405Q670 235 575 135Q500 55 400 115Z" fill="#f4b3b3" class="organ"/><path d="M400 120V500" stroke="#f8f4e8" stroke-width="14"/><rect x="245" y="150" width="140" height="120" rx="45" class="organ blue"/><rect x="230" y="300" width="155" height="155" rx="55" class="organ blue"/><rect x="415" y="150" width="140" height="120" rx="45" class="organ red"/><rect x="415" y="300" width="165" height="170" rx="55" class="organ red"/><path d="M270 130V60H155M530 140V65Q650 55 665 155V215M555 175H690M245 205H110" class="flow"/><path d="M315 270V300M485 270V300" stroke="#244f49" stroke-width="8" marker-end="url(#arrow)"/><path d="M300 285l20 15 20-15M465 285l20 15 20-15" fill="#fff" stroke="#244f49" stroke-width="4"/><text x="250" y="205" class="s">правое предсердие</text><text x="245" y="380" class="s">правый желудочек</text><text x="430" y="205" class="s">левое предсердие</text><text x="430" y="390" class="s">левый желудочек</text><text x="40" y="55" class="t">полые вены</text><text x="610" y="45" class="t">аорта</text><text x="585" y="245" class="t">лёгочная артерия</text><text x="20" y="235" class="t">лёгочные вены</text><text x="333" y="545" class="t">перегородка</text></svg>
