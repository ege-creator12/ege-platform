<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet"><title id="title">Скелет человека</title><desc id="desc">Схематический скелет в анатомическом положении с черепом, позвоночником, грудной клеткой, поясами и конечностями.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#244f49"/></marker><style>.t{font:600 16px Arial,sans-serif;fill:#173b35}.s{font:14px Arial,sans-serif;fill:#173b35}.lead{fill:none;stroke:#244f49;stroke-width:2}.flow{fill:none;stroke:#176b5b;stroke-width:4;marker-end:url(#arrow)}.organ{stroke:#244f49;stroke-width:3}.red{fill:#f7a4a4}.blue{fill:#9bc8ef}.cream{fill:#fff0c9}.green{fill:#b9e4d7}</style></defs><rect width="800" height="580" rx="22" fill="#f8fcfb"/><text x="400" y="36" text-anchor="middle" class="t" font-size="23">Скелет человека</text><g fill="none" stroke="#6b655c" stroke-width="12" stroke-linecap="round"><circle cx="400" cy="95" r="50" fill="#f1eadb"/><path d="M400 145V365M350 180Q400 145 450 180M350 180L270 300L225 420M450 180L530 300L575 420M365 360L315 475L285 535M435 360L485 475L515 535"/><path d="M340 180Q290 250 350 315M460 180Q510 250 450 315" stroke-width="7"/><path d="M345 210H455M335 245H465M340 280H460M350 315H450" stroke-width="5"/><path d="M345 350Q400 395 455 350" stroke-width="20"/></g><text x="90" y="95" class="t">череп</text><path d="M180 92H345" class="lead"/><text x="80" y="215" class="t">грудная клетка</text><path d="M215 210H335" class="lead"/><text x="570" y="230" class="t">позвоночник</text><path d="M565 225L410 245" class="lead"/><text x="90" y="375" class="t">таз</text><path d="M150 370H340" class="lead"/><text x="570" y="390" class="t">конечности</text><path d="M565 385L500 420" class="lead"/></svg>
