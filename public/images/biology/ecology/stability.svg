<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc"><title id="title">Устойчивость и обратные связи</title><desc id="desc">Причинная учебная схема из трёх связанных этапов: исходное условие, механизм и экологическое следствие.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#2563eb"/></marker><style>.h{font:700 24px sans-serif;fill:#17324d}.t{font:17px sans-serif;fill:#17324d}.n{font:700 15px sans-serif;fill:#fff}.b{fill:#eef6ff;stroke:#2563eb;stroke-width:2}.ar{stroke:#2563eb;stroke-width:4;marker-end:url(#a)}</style></defs><text x="480" y="42" text-anchor="middle" class="h">Устойчивость и обратные связи</text><line x1="295" y1="210" x2="350" y2="210" class="ar"/><line x1="610" y1="210" x2="665" y2="210" class="ar"/><g><rect class="b" x="35" y="110" width="260" height="200" rx="18"/><circle cx="70" cy="145" r="20" fill="#2563eb"/><text x="70" y="151" text-anchor="middle" class="n">1</text><foreignObject x="55" y="175" width="220" height="110"><div xmlns="http://www.w3.org/1999/xhtml" style="font:17px sans-serif;color:#17324d;text-align:center">Устойчивость включает сопротивление изменению и способност</div></foreignObject></g><g><rect class="b" x="350" y="110" width="260" height="200" rx="18"/><circle cx="385" cy="145" r="20" fill="#2563eb"/><text x="385" y="151" text-anchor="middle" class="n">2</text><foreignObject x="370" y="175" width="220" height="110"><div xmlns="http://www.w3.org/1999/xhtml" style="font:17px sans-serif;color:#17324d;text-align:center">Биоразнообразие и разветвлённая сеть часто сохраняют функц</div></foreignObject></g><g><rect class="b" x="665" y="110" width="260" height="200" rx="18"/><circle cx="700" cy="145" r="20" fill="#2563eb"/><text x="700" y="151" text-anchor="middle" class="n">3</text><foreignObject x="685" y="175" width="220" height="110"><div xmlns="http://www.w3.org/1999/xhtml" style="font:17px sans-serif;color:#17324d;text-align:center">Причинный ответ стройте: фактор → непосредственно затронут</div></foreignObject></g><text x="480" y="370" text-anchor="middle" class="t">Читайте: условие → действующий процесс → измеримое следствие</text></svg>