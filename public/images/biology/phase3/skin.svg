<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet"><title id="title">Строение кожи</title><desc id="desc">Разрез кожи с эпидермисом, дермой, подкожной клетчаткой, волосом, железами, сосудами и рецепторами.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#244f49"/></marker><style>.t{font:600 16px Arial,sans-serif;fill:#173b35}.s{font:14px Arial,sans-serif;fill:#173b35}.lead{fill:none;stroke:#244f49;stroke-width:2}.flow{fill:none;stroke:#176b5b;stroke-width:4;marker-end:url(#arrow)}.organ{stroke:#244f49;stroke-width:3}.red{fill:#f7a4a4}.blue{fill:#9bc8ef}.cream{fill:#fff0c9}.green{fill:#b9e4d7}</style></defs><rect width="800" height="560" rx="22" fill="#f8fcfb"/><text x="400" y="36" text-anchor="middle" class="t" font-size="23">Строение кожи</text><rect x="80" y="90" width="640" height="85" fill="#ecc2a3" class="organ"/><rect x="80" y="175" width="640" height="240" fill="#f2d6bb" class="organ"/><rect x="80" y="415" width="640" height="110" fill="#f2d66f" class="organ"/><path d="M315 80L360 360" stroke="#5c3c2c" stroke-width="15"/><ellipse cx="380" cy="350" rx="45" ry="25" fill="#d49b6a" class="organ"/><path d="M520 170Q450 250 540 330Q620 400 590 500" fill="none" stroke="#70aeca" stroke-width="12"/><circle cx="540" cy="325" r="35" fill="none" stroke="#70aeca" stroke-width="12"/><path d="M120 460Q250 425 390 470T680 455" fill="none" stroke="#d86262" stroke-width="10"/><path d="M190 220q-35 50 10 85q45-35 10-85" fill="none" stroke="#72549a" stroke-width="8"/><text x="90" y="75" class="t">эпидермис</text><text x="90" y="210" class="t">дерма</text><text x="90" y="505" class="t">подкожная клетчатка</text><text x="360" y="95" class="t">волос</text><text x="390" y="370" class="t">сальная железа</text><text x="540" y="285" class="t">потовая железа</text><text x="110" y="330" class="t">рецептор</text><text x="555" y="480" class="t">сосуды</text></svg>
