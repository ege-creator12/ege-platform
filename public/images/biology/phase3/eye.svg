<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet"><title id="title">Строение глаза</title><desc id="desc">Горизонтальный разрез глаза с оболочками, оптическими средами, сетчаткой, жёлтым и слепым пятном и зрительным нервом.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#244f49"/></marker><style>.t{font:600 16px Arial,sans-serif;fill:#173b35}.s{font:14px Arial,sans-serif;fill:#173b35}.lead{fill:none;stroke:#244f49;stroke-width:2}.flow{fill:none;stroke:#176b5b;stroke-width:4;marker-end:url(#arrow)}.organ{stroke:#244f49;stroke-width:3}.red{fill:#f7a4a4}.blue{fill:#9bc8ef}.cream{fill:#fff0c9}.green{fill:#b9e4d7}</style></defs><rect width="800" height="560" rx="22" fill="#f8fcfb"/><text x="400" y="36" text-anchor="middle" class="t" font-size="23">Строение глаза</text><path d="M115 290Q210 100 500 120Q660 140 700 290Q660 440 500 460Q210 480 115 290Z" fill="#eef4f6" stroke="#596d78" stroke-width="16"/><path d="M130 290Q175 205 215 190Q180 290 215 390Q175 375 130 290Z" fill="#b9e2ef" class="organ"/><path d="M215 190Q280 225 255 290Q280 355 215 390" fill="#6e9d77" class="organ"/><ellipse cx="300" cy="290" rx="48" ry="105" fill="#fff4c2" class="organ"/><path d="M515 135Q650 165 675 290Q650 415 515 445" fill="none" stroke="#d87e85" stroke-width="15"/><path d="M535 145Q655 180 665 290Q655 400 535 435" fill="none" stroke="#e7b76b" stroke-width="8"/><circle cx="615" cy="300" r="11" fill="#cc4545"/><circle cx="650" cy="345" r="11" fill="#555"/><path d="M665 345L780 390" stroke="#e3c66e" stroke-width="32"/><text x="25" y="170" class="t">роговица</text><path d="M120 165L160 210" class="lead"/><text x="175" y="110" class="t">радужка и зрачок</text><path d="M245 115L230 205" class="lead"/><text x="275" y="80" class="t">хрусталик</text><path d="M330 85L310 185" class="lead"/><text x="390" y="290" class="t">стекловидное тело</text><text x="520" y="95" class="t">склера / сосудистая / сетчатка</text><text x="565" y="285" class="s">жёлтое пятно</text><text x="580" y="365" class="s">слепое пятно</text><text x="665" y="445" class="t">зрительный нерв</text></svg>
