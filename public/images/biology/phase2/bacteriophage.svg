<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 788" role="img" aria-labelledby="t d"><title id="t">Бактериофаг: строение и цикл</title><desc id="d">Смысловая структурная схема: Головка: Белковый капсид защищает геном фага.; Хвостовой аппарат: У ряда фагов обеспечивает прикрепление и введение генетического материала.; Адсорбция → проникновение: Рецепторы поверхности бактерии определяют взаимодействие с фагом.; Литический цикл: Синтез компонентов → сборка новых фагов → выход, часто с лизисом клетки.; Лизогенный путь: Геном умеренного фага сохраняется в клетке, например как профаг; возможна индукция литического цикла.</desc><rect width="680" height="788" rx="20" fill="#fafbf8"/><g font-family="Arial,sans-serif" fill="#234c3c"><text x="28" y="40" font-size="26" font-weight="700">Бактериофаг: строение и цикл</text><text x="28" y="70" font-size="17" fill="#62776d">Структуры и связи · учебная схема</text><rect x="22" y="96" width="636" height="93" rx="16" fill="#e3efe8"/><text x="42" y="128" font-size="24" font-weight="700">Головка</text><text x="42" y="161" font-size="22">Белковый капсид защищает геном фага.</text><rect x="22" y="203" width="636" height="120" rx="16" fill="#edf1e3"/><text x="42" y="235" font-size="24" font-weight="700">Хвостовой аппарат</text><text x="42" y="268" font-size="22">У ряда фагов обеспечивает прикрепление и введение</text><text x="42" y="295" font-size="22">генетического материала.</text><rect x="22" y="337" width="636" height="120" rx="16" fill="#e3efe8"/><text x="42" y="369" font-size="24" font-weight="700">Адсорбция → проникновение</text><text x="42" y="402" font-size="22">Рецепторы поверхности бактерии определяют</text><text x="42" y="429" font-size="22">взаимодействие с фагом.</text><rect x="22" y="471" width="636" height="120" rx="16" fill="#edf1e3"/><text x="42" y="503" font-size="24" font-weight="700">Литический цикл</text><text x="42" y="536" font-size="22">Синтез компонентов → сборка новых фагов → выход,</text><text x="42" y="563" font-size="22">часто с лизисом клетки.</text><rect x="22" y="605" width="636" height="147" rx="16" fill="#e3efe8"/><text x="42" y="637" font-size="24" font-weight="700">Лизогенный путь</text><text x="42" y="670" font-size="22">Геном умеренного фага сохраняется в клетке,</text><text x="42" y="697" font-size="22">например как профаг; возможна индукция</text><text x="42" y="724" font-size="22">литического цикла.</text></g></svg>
