<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet"><title id="title">Рефлекторная дуга</title><desc id="desc">Анатомически ориентированная дуга: рецептор кожи, чувствительный путь через задний корешок, центр спинного мозга, двигательный путь и мышца.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#244f49"/></marker><style>.t{font:600 16px Arial,sans-serif;fill:#173b35}.s{font:14px Arial,sans-serif;fill:#173b35}.lead{fill:none;stroke:#244f49;stroke-width:2}.flow{fill:none;stroke:#176b5b;stroke-width:4;marker-end:url(#arrow)}.organ{stroke:#244f49;stroke-width:3}.red{fill:#f7a4a4}.blue{fill:#9bc8ef}.cream{fill:#fff0c9}.green{fill:#b9e4d7}</style></defs><rect width="800" height="560" rx="22" fill="#f8fcfb"/><text x="400" y="36" text-anchor="middle" class="t" font-size="23">Рефлекторная дуга</text><path d="M80 160Q150 110 220 165" stroke="#e8b493" stroke-width="45"/><circle cx="155" cy="145" r="18" fill="#8c609f"/><path d="M155 145Q280 110 360 225" stroke="#3d79b7" stroke-width="8" fill="none" marker-end="url(#arrow)"/><ellipse cx="435" cy="280" rx="100" ry="145" fill="#eee5d9" class="organ"/><path d="M410 205Q350 250 410 290Q350 330 410 360M460 205Q520 250 460 290Q520 330 460 360" fill="#8c609f"/><path d="M455 350Q575 410 675 360" stroke="#d45d5d" stroke-width="8" fill="none" marker-end="url(#arrow)"/><ellipse cx="700" cy="350" rx="55" ry="95" fill="#df7878" class="organ"/><text x="70" y="90" class="t">раздражитель → рецептор</text><text x="190" y="120" class="t">чувствительный нейрон</text><text x="360" y="105" class="t">задний корешок</text><text x="360" y="455" class="t">спинной мозг</text><text x="510" y="445" class="t">передний корешок</text><text x="625" y="250" class="t">двигательный</text><text x="670" y="475" class="t">мышца-эффектор</text></svg>
