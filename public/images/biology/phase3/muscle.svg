<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet"><title id="title">Строение скелетной мышцы</title><desc id="desc">Иерархия мышцы с сухожилием, пучком, волокном, миофибриллами и актин-миозиновым аппаратом.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#244f49"/></marker><style>.t{font:600 16px Arial,sans-serif;fill:#173b35}.s{font:14px Arial,sans-serif;fill:#173b35}.lead{fill:none;stroke:#244f49;stroke-width:2}.flow{fill:none;stroke:#176b5b;stroke-width:4;marker-end:url(#arrow)}.organ{stroke:#244f49;stroke-width:3}.red{fill:#f7a4a4}.blue{fill:#9bc8ef}.cream{fill:#fff0c9}.green{fill:#b9e4d7}</style></defs><rect width="800" height="560" rx="22" fill="#f8fcfb"/><text x="400" y="36" text-anchor="middle" class="t" font-size="23">Строение скелетной мышцы</text><path d="M70 170L170 205Q290 90 420 205L520 170L420 250Q290 365 170 250Z" fill="#d96363" class="organ"/><path d="M35 160L170 205M520 170L665 125" stroke="#ead8b2" stroke-width="35"/><ellipse cx="290" cy="230" rx="105" ry="55" fill="#f38b8b" stroke="#733"/><g stroke="#fff" stroke-width="5"><path d="M210 195H370"/><path d="M210 207H370"/><path d="M210 219H370"/><path d="M210 231H370"/><path d="M210 243H370"/><path d="M210 255H370"/><path d="M210 267H370"/></g><path d="M395 240H720" class="lead"/><rect x="520" y="210" width="210" height="65" rx="30" fill="#f6a0a0" class="organ"/><path d="M540 230H710M540 245H710M540 260H710" stroke="#fff"/><text x="45" y="115" class="t">сухожилие</text><text x="210" y="390" class="t">мышца → пучок</text><text x="515" y="320" class="t">волокно → миофибриллы</text><text x="515" y="350" class="s">актин и миозин скользят</text></svg>
