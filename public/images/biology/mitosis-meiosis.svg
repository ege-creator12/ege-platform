<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="title desc"><title id="title">Митоз и мейоз</title><desc id="desc">Оригинальная учебная схема ОСНОВЫ: митоз: хроматиды, мейоз I: гомологи, мейоз II: хроматиды, 2n4c → n2c → nc</desc><style>.head{font:700 28px system-ui,sans-serif;fill:#173f35}.line{font:600 21px system-ui,sans-serif;fill:#173f35}</style><rect width="760" height="440" rx="28" fill="#f7fcfa"/><text x="380" y="48" text-anchor="middle" class="head">Митоз и мейоз</text><g><rect x="70" y="80" width="620" height="58" rx="18" fill="#dff4ec" stroke="#25745f" stroke-width="3"/><text x="380" y="117" text-anchor="middle" class="line">митоз: хроматиды</text></g><g><rect x="70" y="162" width="620" height="58" rx="18" fill="#fff2df" stroke="#25745f" stroke-width="3"/><text x="380" y="199" text-anchor="middle" class="line">мейоз I: гомологи</text></g><g><rect x="70" y="244" width="620" height="58" rx="18" fill="#dff4ec" stroke="#25745f" stroke-width="3"/><text x="380" y="281" text-anchor="middle" class="line">мейоз II: хроматиды</text></g><g><rect x="70" y="326" width="620" height="58" rx="18" fill="#fff2df" stroke="#25745f" stroke-width="3"/><text x="380" y="363" text-anchor="middle" class="line">2n4c → n2c → nc</text></g></svg>