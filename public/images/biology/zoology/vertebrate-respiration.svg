<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" role="img" aria-labelledby="title desc"><title id="title">Дыхание позвоночных</title><desc id="desc">Учебная схема ОСНОВА для подготовки к ЕГЭ: РЫБЫ &#8594; жабры; ЗЕМНОВОДНЫЕ &#8594; лёгкие + кожа; ПРЕСМЫКАЮЩИЕСЯ &#8594; ячеистые лёгкие; ПТИЦЫ &#8594; лёгкие + воздушные мешки; МЛЕКОПИТАЮЩИЕ &#8594; альвеолы + диафрагма</desc><rect width="920" height="540" rx="28" fill="#FFFDF7"/><text x="460" y="64" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#173B3F">Дыхание позвоночных</text><path d="M60 88 H860" stroke="#E9A23B" stroke-width="6" stroke-linecap="round"/><g><rect x="60" y="125" width="800" height="60" rx="16" fill="#F1F8EE" stroke="#39736A" stroke-width="2"/><text x="84" y="163" font-size="24" font-weight="500" fill="#173B3F">РЫБЫ &#8594; жабры</text></g><g><rect x="60" y="195" width="800" height="60" rx="16" fill="#EAF4FF" stroke="#39736A" stroke-width="2"/><text x="84" y="233" font-size="24" font-weight="500" fill="#173B3F">ЗЕМНОВОДНЫЕ &#8594; лёгкие + кожа</text></g><g><rect x="60" y="265" width="800" height="60" rx="16" fill="#F1F8EE" stroke="#39736A" stroke-width="2"/><text x="84" y="303" font-size="24" font-weight="500" fill="#173B3F">ПРЕСМЫКАЮЩИЕСЯ &#8594; ячеистые лёгкие</text></g><g><rect x="60" y="335" width="800" height="60" rx="16" fill="#EAF4FF" stroke="#39736A" stroke-width="2"/><text x="84" y="373" font-size="24" font-weight="500" fill="#173B3F">ПТИЦЫ &#8594; лёгкие + воздушные мешки</text></g><g><rect x="60" y="405" width="800" height="60" rx="16" fill="#F1F8EE" stroke="#39736A" stroke-width="2"/><text x="84" y="443" font-size="24" font-weight="500" fill="#173B3F">МЛЕКОПИТАЮЩИЕ &#8594; альвеолы + диафрагма</text></g><text x="860" y="516" text-anchor="end" font-family="Arial,sans-serif" font-size="16" fill="#557276">ОСНОВА · ЕГЭ 2027</text></svg>
