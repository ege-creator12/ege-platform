<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" role="img" aria-labelledby="title desc"><title id="title">Общий план хордового</title><desc id="desc">Учебная схема ОСНОВА для подготовки к ЕГЭ: спинная нервная трубка; хорда; глотка с жаберными щелями; сквозной кишечник; постанальный хвост</desc><rect width="920" height="540" rx="28" fill="#FFFDF7"/><text x="460" y="64" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#173B3F">Общий план хордового</text><path d="M60 88 H860" stroke="#E9A23B" stroke-width="6" stroke-linecap="round"/><g><rect x="60" y="125" width="800" height="60" rx="16" fill="#F1F8EE" stroke="#39736A" stroke-width="2"/><text x="84" y="163" font-size="24" font-weight="500" fill="#173B3F">спинная нервная трубка</text></g><g><rect x="60" y="195" width="800" height="60" rx="16" fill="#EAF4FF" stroke="#39736A" stroke-width="2"/><text x="84" y="233" font-size="24" font-weight="500" fill="#173B3F">хорда</text></g><g><rect x="60" y="265" width="800" height="60" rx="16" fill="#F1F8EE" stroke="#39736A" stroke-width="2"/><text x="84" y="303" font-size="24" font-weight="500" fill="#173B3F">глотка с жаберными щелями</text></g><g><rect x="60" y="335" width="800" height="60" rx="16" fill="#EAF4FF" stroke="#39736A" stroke-width="2"/><text x="84" y="373" font-size="24" font-weight="500" fill="#173B3F">сквозной кишечник</text></g><g><rect x="60" y="405" width="800" height="60" rx="16" fill="#F1F8EE" stroke="#39736A" stroke-width="2"/><text x="84" y="443" font-size="24" font-weight="500" fill="#173B3F">постанальный хвост</text></g><text x="860" y="516" text-anchor="end" font-family="Arial,sans-serif" font-size="16" fill="#557276">ОСНОВА · ЕГЭ 2027</text></svg>
