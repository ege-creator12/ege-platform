<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 788" role="img" aria-labelledby="t d"><title id="t">Органы цветка</title><desc id="d">Смысловая структурная схема: Цветоложе и цветоножка: Несут и соединяют части цветка с побегом.; Околоцветник: Чашечка и венчик в двойном околоцветнике; защита и участие в привлечении опылителей.; Тычинка: Тычиночная нить + пыльник. В пыльнике формируются пыльцевые зёрна.; Пестик: Рыльце + столбик + завязь. В завязи располагаются семязачатки.; После оплодотворения: Семязачаток → семя; завязь участвует в образовании плода. Опыление предшествует оплодотворению.</desc><rect width="680" height="788" rx="20" fill="#fafbf8"/><g font-family="Arial,sans-serif" fill="#234c3c"><text x="28" y="40" font-size="26" font-weight="700">Органы цветка</text><text x="28" y="70" font-size="17" fill="#62776d">Структуры и связи · учебная схема</text><rect x="22" y="96" width="636" height="93" rx="16" fill="#e3efe8"/><text x="42" y="128" font-size="24" font-weight="700">Цветоложе и цветоножка</text><text x="42" y="161" font-size="22">Несут и соединяют части цветка с побегом.</text><rect x="22" y="203" width="636" height="120" rx="16" fill="#edf1e3"/><text x="42" y="235" font-size="24" font-weight="700">Околоцветник</text><text x="42" y="268" font-size="22">Чашечка и венчик в двойном околоцветнике; защита</text><text x="42" y="295" font-size="22">и участие в привлечении опылителей.</text><rect x="22" y="337" width="636" height="120" rx="16" fill="#e3efe8"/><text x="42" y="369" font-size="24" font-weight="700">Тычинка</text><text x="42" y="402" font-size="22">Тычиночная нить + пыльник. В пыльнике формируются</text><text x="42" y="429" font-size="22">пыльцевые зёрна.</text><rect x="22" y="471" width="636" height="120" rx="16" fill="#edf1e3"/><text x="42" y="503" font-size="24" font-weight="700">Пестик</text><text x="42" y="536" font-size="22">Рыльце + столбик + завязь. В завязи располагаются</text><text x="42" y="563" font-size="22">семязачатки.</text><rect x="22" y="605" width="636" height="147" rx="16" fill="#e3efe8"/><text x="42" y="637" font-size="24" font-weight="700">После оплодотворения</text><text x="42" y="670" font-size="22">Семязачаток → семя; завязь участвует в</text><text x="42" y="697" font-size="22">образовании плода. Опыление предшествует</text><text x="42" y="724" font-size="22">оплодотворению.</text></g></svg>
