<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 654" role="img" aria-labelledby="t d"><title id="t">Кровообращение птицы</title><desc id="d">Смысловая структурная схема: Правая половина сердца: Правое предсердие → правый желудочек → лёгочные артерии.; Лёгкие → левая половина: Лёгочные вены → левое предсердие → левый желудочек.; Большой круг: Левый желудочек → правая дуга аорты → органы → правое предсердие.; Полное разделение: Четыре камеры и сплошная перегородка поддерживают высокую интенсивность обмена.</desc><rect width="680" height="654" rx="20" fill="#fafbf8"/><g font-family="Arial,sans-serif" fill="#234c3c"><text x="28" y="40" font-size="26" font-weight="700">Кровообращение птицы</text><text x="28" y="70" font-size="17" fill="#62776d">Структуры и связи · учебная схема</text><rect x="22" y="96" width="636" height="120" rx="16" fill="#e3efe8"/><text x="42" y="128" font-size="24" font-weight="700">Правая половина сердца</text><text x="42" y="161" font-size="22">Правое предсердие → правый желудочек → лёгочные</text><text x="42" y="188" font-size="22">артерии.</text><rect x="22" y="230" width="636" height="120" rx="16" fill="#edf1e3"/><text x="42" y="262" font-size="24" font-weight="700">Лёгкие → левая половина</text><text x="42" y="295" font-size="22">Лёгочные вены → левое предсердие → левый</text><text x="42" y="322" font-size="22">желудочек.</text><rect x="22" y="364" width="636" height="120" rx="16" fill="#e3efe8"/><text x="42" y="396" font-size="24" font-weight="700">Большой круг</text><text x="42" y="429" font-size="22">Левый желудочек → правая дуга аорты → органы →</text><text x="42" y="456" font-size="22">правое предсердие.</text><rect x="22" y="498" width="636" height="120" rx="16" fill="#edf1e3"/><text x="42" y="530" font-size="24" font-weight="700">Полное разделение</text><text x="42" y="563" font-size="22">Четыре камеры и сплошная перегородка поддерживают</text><text x="42" y="590" font-size="22">высокую интенсивность обмена.</text></g></svg>
